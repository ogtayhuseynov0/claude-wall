<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282b36"/>
      <stop offset="1" stop-color="#1a1c23"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e42"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- wall / device body -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#3a3f4d" stroke-width="1"/>

  <!-- three idle panes -->
  <rect x="17.2" y="5.6" width="9.2" height="9.2" rx="2.2" fill="#2f3340"/>
  <rect x="5.6"  y="17.2" width="9.2" height="9.2" rx="2.2" fill="#2f3340"/>
  <rect x="17.2" y="17.2" width="9.2" height="9.2" rx="2.2" fill="#2f3340"/>

  <!-- one live pane, Claude orange -->
  <rect x="5.6" y="5.6" width="9.2" height="9.2" rx="2.2" fill="url(#lit)"/>
  <!-- sparkle on the live pane -->
  <g filter="url(#glow)">
    <path d="M10.2 6.5 L11.05 9.35 L13.9 10.2 L11.05 11.05 L10.2 13.9 L9.35 11.05 L6.5 10.2 L9.35 9.35 Z"
          fill="#fff6ec"/>
  </g>
</svg>
