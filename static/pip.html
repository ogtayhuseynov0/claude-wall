<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>PiP</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Wall">
<script src="/ansi_up.min.js"></script>
<style>
  :root { --bg:transparent; --bar:rgba(24,27,36,0.35); --fg:#f0f2f6; --muted:#9aa0b0; --accent:#6ea1f7; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace; }
  body { display:flex; flex-direction:column; outline:none; position:relative; overflow:hidden; }
  #bar { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:4px 8px;
    background:var(--bar); border-bottom:1px solid rgba(80,86,104,0.35); font-size:12px; user-select:none; -webkit-app-region:drag; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto; margin:0 2px; }
  #dot.idle { background:#57d977; } #dot.working { background:#f5a742; box-shadow:0 0 7px #f5a742; }
  #dot.error { background:#e5566a; } #dot.connecting,#dot.disconnected { background:var(--muted); }
  #title { font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sub { color:var(--muted); white-space:nowrap; }
  #spacer { flex:1; }
  #back { -webkit-app-region:no-drag; cursor:pointer; color:var(--fg); display:none;
    align-items:center; justify-content:center; border-radius:8px; }
  #back:active { background:#2a2e3a; }
  .btn { -webkit-app-region:no-drag; cursor:pointer; color:var(--muted); border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center; }
  .btn:hover { color:var(--fg); background:#2a2e3a; }
  .btn:active { background:#2a2e3a; }
  /* icon buttons: compact on desktop (native app), large tap targets on touch */
  #bar .ic { stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  #back, .btn { width:30px; height:26px; }
  #back .ic, .btn .ic { width:17px; height:17px; }
  .mobile #bar { gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-top)); }
  .mobile #back, .mobile .btn { width:42px; height:38px; }
  .mobile #back .ic, .mobile .btn .ic { width:23px; height:23px; }
  .mobile #title { font-size:14px; }
  #term { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:8px 10px; -webkit-overflow-scrolling:touch; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:var(--fs,12.5px); line-height:1.35; }
  /* mobile: don't wrap wide TUI lines into 4-5 rows — keep one line, fit the
     font to the pane width, allow horizontal scroll once at the min size. */
  .mobile #term { overflow-x:auto; }
  .mobile pre { white-space:pre; word-break:normal; }
  #history { opacity:.72; }
  .hrule { display:block; border-top:1px solid #2a2e3a; margin:3px 0; }
  #term::-webkit-scrollbar { width:9px; } #term::-webkit-scrollbar-thumb { background:#2f3340; border-radius:5px; }
  /* hidden field that summons the soft keyboard on touch devices */
  #kbd { position:absolute; bottom:0; left:0; opacity:0; height:1px; width:1px; border:0; padding:0;
    resize:none; overflow:hidden; }
  /* on-screen key toolbar (Esc/Ctrl/Tab/arrows the soft keyboard lacks) */
  #keys { display:none; flex:0 0 auto; gap:6px; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:#161922; border-top:1px solid #2a2e3a; overflow-x:auto; white-space:nowrap; }
  #keys button { flex:0 0 auto; min-width:40px; height:38px; border-radius:8px; border:1px solid #2f3340;
    background:#20242e; color:var(--fg); font-size:14px; font-family:inherit; }
  #keys button:active { background:#2f3340; }
  #keys button.on { background:var(--accent); color:#0d0f14; border-color:var(--accent); }
</style>
</head>
<body tabindex="0">
  <div id="bar">
    <span id="back" title="Sessions"><svg class="ic" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></span>
    <span id="dot" class="connecting"></span>
    <span id="title">…</span><span id="sub"></span>
    <span id="spacer"></span>
    <span class="btn" id="goto" title="Focus this pane in the terminal"><svg class="ic" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></span>
    <span class="btn" id="close" title="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
  </div>
  <div id="term"><pre id="history"></pre><pre id="live"></pre></div>
  <textarea id="kbd" rows="1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="text"></textarea>
  <div id="keys">
    <button data-k="esc">esc</button>
    <button data-k="ctrl" id="kctrl">ctrl</button>
    <button data-k="tab">tab</button>
    <button data-k="up">↑</button>
    <button data-k="down">↓</button>
    <button data-k="left">←</button>
    <button data-k="right">→</button>
    <button data-k="bs">⌫</button>
    <button data-k="cc">^C</button>
    <button data-k="enter">⏎</button>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const target = params.get('target') || '';
  const MOBILE = params.get('m') === '1' || matchMedia('(pointer:coarse)').matches;
  const ansi = new AnsiUp();
  const stripOSC = (t) => t.replace(/\x1b\]8;[^]*?(?:\x1b\\|\x07)(.*?)\x1b\]8;[^]*?(?:\x1b\\|\x07)/g,'$1').replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g,'');
  const renderAnsi = (t) => ansi.ansi_to_html(stripOSC(t)).replace(/^@@HRULE@@$/gm,'<span class="hrule"></span>');

  const term = document.getElementById('term');
  const historyPre = document.getElementById('history');
  const livePre = document.getElementById('live');
  const dot = document.getElementById('dot');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const kbd = document.getElementById('kbd');
  document.title = 'PiP · ' + target;
  titleEl.textContent = target.split(':')[0] || target;
  subEl.textContent = target ? '· ' + target : '';

  // Mobile: solid dark background (native app supplies its own), key toolbar + back button.
  if (MOBILE) {
    document.body.classList.add('mobile');
    document.documentElement.style.setProperty('--bg', '#0d0f14');
    document.documentElement.style.setProperty('--bar', '#161922');
    document.getElementById('keys').style.display = 'flex';
    if (params.get('m') === '1') document.getElementById('back').style.display = 'inline-flex';
  }

  let ws, reconnectDelay = 500, lastContent = '';
  const atBottom = () => (term.scrollHeight - term.scrollTop - term.clientHeight) < 40;
  const toBottom = () => { term.scrollTop = term.scrollHeight; };
  // follow = auto-stick to bottom. Cleared when the user scrolls up to read,
  // re-armed when they scroll back down or tap to type. Prevents the yank-down.
  let follow = true;
  term.addEventListener('scroll', () => { follow = atBottom(); });
  const setStatus = (s) => { dot.className = s || 'connecting'; };

  // mobile: fit the monospace font so the widest line fits the pane width
  // (avoids wide TUI lines wrapping to 4-5 rows). Floor at 7px → horizontal scroll.
  const BASE_FS = 12.5, MIN_FS = 7;
  let fitPending = false;
  function fitFont() {
    if (!MOBILE) return;
    document.documentElement.style.setProperty('--fs', BASE_FS + 'px');
    const natural = Math.max(historyPre.scrollWidth, livePre.scrollWidth, 1);
    const avail = term.clientWidth - 20; // minus padding
    let f = BASE_FS;
    if (natural > avail) f = Math.max(MIN_FS, BASE_FS * avail / natural);
    document.documentElement.style.setProperty('--fs', f.toFixed(1) + 'px');
  }
  const scheduleFit = () => { if (fitPending) return; fitPending = true; requestAnimationFrame(() => { fitPending = false; fitFont(); }); };
  const send = (data) => {
    if (!data || !ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'input', data }));
    follow = true; toBottom(); // sending input means we're at the prompt
  };

  function connect() {
    setStatus('connecting');
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/${target}`);
    ws.onopen = () => { setStatus('idle'); reconnectDelay = 500; ws.send(JSON.stringify({type:'history-mode',data:'on'})); sendViewing(); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'history') {
        historyPre.innerHTML = renderAnsi(msg.data);
        scheduleFit();
        if (follow) toBottom();
        if (msg.status) setStatus(msg.status);
      } else if (msg.type === 'content') {
        if (msg.data === lastContent) { if (msg.status) setStatus(msg.status); return; }
        lastContent = msg.data;
        livePre.innerHTML = renderAnsi(msg.data);
        scheduleFit();
        if (msg.status) setStatus(msg.status);
        if (follow) toBottom();
      } else if (msg.type === 'status-update') {
        if (msg.status) setStatus(msg.status);
      } else if (msg.type === 'status' && msg.data === 'disconnected') {
        setStatus('disconnected');
      }
    };
    ws.onclose = () => { setStatus('disconnected'); setTimeout(() => { reconnectDelay = Math.min(reconnectDelay*1.5, 8000); connect(); }, reconnectDelay); };
    ws.onerror = () => ws.close();
  }

  // hardware keyboard (desktop + phones with a BT keyboard)
  document.addEventListener('keydown', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    let data = '';
    if (e.ctrlKey && !e.metaKey && e.key.length === 1) {
      const code = e.key.toLowerCase().charCodeAt(0) - 96;
      if (code > 0 && code < 27) { data = String.fromCharCode(code); e.preventDefault(); }
    } else if (e.key.length === 1 && !e.metaKey) {
      data = e.key; e.preventDefault();
    } else {
      switch (e.key) {
        case 'Enter': data = '\r'; break;
        case 'Backspace': data = '\x7f'; break;
        case 'Tab': data = e.shiftKey ? '\x1b[Z' : '\t'; e.preventDefault(); break;
        case 'Escape': data = '\x1b'; break;
        case 'ArrowUp': data = '\x1b[A'; break;
        case 'ArrowDown': data = '\x1b[B'; break;
        case 'ArrowRight': data = '\x1b[C'; break;
        case 'ArrowLeft': data = '\x1b[D'; break;
        case 'PageUp': data = '\x1b[5~'; break;
        case 'PageDown': data = '\x1b[6~'; break;
        case 'Home': data = '\x1b[H'; break;
        case 'End': data = '\x1b[F'; break;
        case 'Delete': data = '\x1b[3~'; break;
      }
      if (data) e.preventDefault();
    }
    send(data);
  });

  // soft keyboard (mobile): capture typed AND dictated text via input +
  // composition events. Crucially we do NOT preventDefault — that breaks Gboard
  // voice dictation (it composes into the field; blocking it drops the text).
  let ctrlArmed = false, composing = false, lastComposed = '', justComposed = false;
  const setCtrl = (on) => { ctrlArmed = on; document.getElementById('kctrl').classList.toggle('on', on); };
  const applyCtrl = (s) => {
    if (!ctrlArmed || !s) return s;
    setCtrl(false);
    if (s.length === 1) { const c = s.toLowerCase().charCodeAt(0) - 96; if (c > 0 && c < 27) return String.fromCharCode(c); }
    return s;
  };
  const flushKbd = () => { if (kbd.value) { send(applyCtrl(kbd.value)); kbd.value = ''; } };
  // stream the change from the last composition snapshot: backspace what changed,
  // send the new tail — so dictation lands word-by-word (and corrections replay).
  const streamDelta = (oldS, cur) => {
    let i = 0; const n = Math.min(oldS.length, cur.length);
    while (i < n && oldS[i] === cur[i]) i++;
    const del = oldS.length - i;
    if (del > 0) send('\x7f'.repeat(del));
    if (cur.length > i) send(cur.slice(i));
  };
  kbd.addEventListener('compositionstart', () => { composing = true; lastComposed = ''; });
  kbd.addEventListener('compositionupdate', (e) => {
    if (!composing) return;
    const cur = e.data || '';
    streamDelta(lastComposed, cur);
    lastComposed = cur;
  });
  kbd.addEventListener('compositionend', (e) => {
    composing = false;
    const finalStr = e.data || lastComposed;
    streamDelta(lastComposed, finalStr);               // final delta
    if (finalStr) send(' ');                            // space after each dictated phrase
    lastComposed = ''; kbd.value = '';
    justComposed = true; setTimeout(() => { justComposed = false; }, 0);
  });
  kbd.addEventListener('input', (e) => {
    if (composing) return;                              // handled by composition events
    if (justComposed) { justComposed = false; kbd.value = ''; return; } // swallow the post-commit input
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { kbd.value = ''; send('\r'); return; }
    if (e.inputType === 'deleteContentBackward') { kbd.value = ''; send('\x7f'); return; }
    flushKbd();
  });

  document.addEventListener('paste', (e) => {
    e.preventDefault();
    send((e.clipboardData || window.clipboardData).getData('text'));
  });

  // key toolbar
  const KEYSEQ = { esc:'\x1b', tab:'\t', up:'\x1b[A', down:'\x1b[B', left:'\x1b[D', right:'\x1b[C', bs:'\x7f', cc:'\x03', enter:'\r' };
  document.getElementById('keys').addEventListener('mousedown', (e) => e.preventDefault()); // keep the field focused
  document.getElementById('keys').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    if (k === 'ctrl') { setCtrl(!ctrlArmed); kbd.focus({ preventScroll: true }); return; }
    send(KEYSEQ[k]);
    kbd.focus({ preventScroll: true });
  });

  document.getElementById('close').onclick = () => { try { ws && ws.close(); } catch(_){} window.close(); };
  document.getElementById('goto').onclick = () => { fetch('/api/goto/' + encodeURIComponent(target)).catch(()=>{}); };
  document.getElementById('back').onclick = () => { location.href = '/m.html'; };

  // focus: desktop keeps body focused; mobile focuses the hidden field to raise
  // the keyboard. preventScroll stops the browser jumping to the 1px field.
  window.addEventListener('load', () => { if (!MOBILE) document.body.focus(); }); // don't auto-raise the keyboard on phones
  // A click fires on a tap but not after a scroll gesture (browser suppresses it),
  // and is a user gesture so focus() reliably raises the soft keyboard.
  term.addEventListener('click', () => {
    if (MOBILE) { follow = true; kbd.focus({ preventScroll: true }); toBottom(); }
    else document.body.focus();
  });

  // keyboard open/close resizes the visual viewport — shrink the app to the
  // visible area, re-pinning to bottom only when following.
  if (MOBILE && window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => { document.body.style.height = vv.height + 'px'; scheduleFit(); };
    vv.addEventListener('resize', () => { fit(); if (follow) toBottom(); });
    fit();
  }
  window.addEventListener('orientationchange', scheduleFit);

  // tell the server we're actively viewing this pane, so it suppresses pushes
  // for it while the tab is open + visible.
  const sendViewing = () => { if (!document.hidden && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'viewing' })); };
  setInterval(sendViewing, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sendViewing(); });

  // keep the screen awake while watching a pane on mobile
  let wakeLock = null;
  async function acquireWake() {
    if (!MOBILE || !('wakeLock' in navigator) || document.hidden) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) acquireWake(); });
  acquireWake();

  if (!target) { livePre.textContent = 'no ?target= given'; } else { connect(); }
</script>
</body>
</html>
