<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>PiP</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Wall">
<script src="/ansi_up.min.js"></script>
<style>
  :root { --bg:transparent; --bar:rgba(24,27,36,0.35); --fg:#f0f2f6; --muted:#9aa0b0; --accent:#6ea1f7; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace; }
  body { display:flex; flex-direction:column; outline:none; position:relative; overflow:hidden; }
  #bar { flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:4px 8px;
    background:var(--bar); border-bottom:1px solid rgba(80,86,104,0.35); font-size:12px; user-select:none; -webkit-app-region:drag; }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--muted); flex:0 0 auto; margin:0 2px; }
  #dot.idle { background:#5b6172; } #dot.working { background:#57d977; box-shadow:0 0 7px #57d977; }
  #dot.error { background:#e5566a; } #dot.connecting,#dot.disconnected { background:var(--muted); }
  #title { font-weight:600; color:var(--fg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #sub { color:var(--muted); white-space:nowrap; }
  #spacer { flex:1; }
  #back { -webkit-app-region:no-drag; cursor:pointer; color:var(--fg); display:none;
    align-items:center; justify-content:center; border-radius:8px; }
  #back:active { background:#2a2e3a; }
  .btn { -webkit-app-region:no-drag; cursor:pointer; color:var(--muted); border-radius:8px;
    display:inline-flex; align-items:center; justify-content:center; }
  .btn:hover { color:var(--fg); background:#2a2e3a; }
  .btn:active { background:#2a2e3a; }
  /* icon buttons: compact on desktop (native app), large tap targets on touch */
  #bar .ic { stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; }
  #back, .btn { width:30px; height:26px; }
  #back .ic, .btn .ic { width:17px; height:17px; }
  .mobile #bar { gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-top)); }
  .mobile #back, .mobile .btn { width:42px; height:38px; }
  .mobile #back .ic, .mobile .btn .ic { width:23px; height:23px; }
  .mobile #title { font-size:14px; }
  #term { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:8px 10px; -webkit-overflow-scrolling:touch; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; font-size:var(--fs,12.5px); line-height:1.35; }
  /* mobile: don't wrap wide TUI lines into 4-5 rows — keep one line, fit the
     font to the pane width, allow horizontal scroll once at the min size. */
  .mobile #term { overflow-x:auto; }
  .mobile pre { white-space:pre; word-break:normal; }
  #history { opacity:.72; }
  .hrule { display:block; border-top:1px solid #2a2e3a; margin:3px 0; }
  #term::-webkit-scrollbar { width:9px; } #term::-webkit-scrollbar-thumb { background:#2f3340; border-radius:5px; }
  /* hidden field that summons the soft keyboard on touch devices */
  #kbd { position:absolute; bottom:0; left:0; opacity:0; height:1px; width:1px; border:0; padding:0;
    resize:none; overflow:hidden; }
  /* on-screen key toolbar (Esc/Ctrl/Tab/arrows the soft keyboard lacks) */
  #keys { display:none; flex:0 0 auto; gap:6px; padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    background:#161922; border-top:1px solid #2a2e3a; overflow-x:auto; white-space:nowrap; }
  #keys button { flex:0 0 auto; min-width:40px; height:38px; border-radius:8px; border:1px solid #2f3340;
    background:#20242e; color:var(--fg); font-size:14px; font-family:inherit; }
  #keys button:active { background:#2f3340; }
  #keys button.on { background:var(--accent); color:#0d0f14; border-color:var(--accent); }
  #keys button#kbottom { background:var(--accent); color:#0d0f14; border-color:var(--accent); font-size:19px; font-weight:700; }
  #keys button#krestart { font-size:17px; }
  #keys button#kattach { min-width:46px; display:inline-flex; align-items:center; justify-content:center; gap:5px; }
  #keys button .spin { display:inline-block; width:14px; height:14px; border:2px solid #ffffff33;
    border-top-color:var(--accent); border-radius:50%; animation:kspin .7s linear infinite; flex:0 0 auto; }
  #keys button .pn { font-size:12px; font-weight:700; }
  #keys button .pn:empty { display:none; }
  @keyframes kspin { to { transform:rotate(360deg); } }
  [hidden] { display:none !important; }
  /* restart confirm modal */
  .rm-overlay { position:fixed; inset:0; z-index:50; background:rgba(6,8,12,0.66);
    display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:560px) { .rm-overlay { align-items:center; } }
  .rm-card { width:100%; max-width:440px; background:#161922; border:1px solid #2a2e3a;
    border-radius:16px 16px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width:560px) { .rm-card { border-radius:16px; } }
  .rm-title { font-size:16px; font-weight:700; }
  .rm-desc { font-size:12.5px; color:var(--muted); margin:5px 0 14px; line-height:1.4; }
  .rm-seg { display:flex; gap:7px; margin-bottom:16px; }
  .rm-seg button { flex:1; padding:11px 6px; border-radius:10px; border:1px solid #2f3340;
    background:#20242e; color:var(--fg); font-size:13px; font-family:inherit; font-weight:600; }
  .rm-seg button.on { background:var(--accent); color:#0d0f14; border-color:var(--accent); }
  .rm-actions { display:flex; gap:9px; }
  .rm-btn { flex:1; padding:12px; border-radius:11px; border:1px solid #2f3340; background:#20242e;
    color:var(--fg); font-size:14px; font-weight:650; font-family:inherit; }
  .rm-danger { background:#e5484d; border-color:#e5484d; color:#fff; }
  /* sibling-pane switcher */
  #panebar { display:flex; align-items:center; gap:6px; padding:6px 8px; background:var(--bar);
    border-bottom:1px solid var(--line); flex:0 0 auto; }
  #panetabs { display:flex; gap:6px; overflow-x:auto; flex:1 1 auto; min-width:0; -webkit-overflow-scrolling:touch; }
  #panetabs::-webkit-scrollbar { display:none; }
  .ptab { flex:0 0 auto; background:#20242e; border:1px solid var(--line); color:var(--muted);
    border-radius:8px; padding:5px 10px; font:600 12px/1 inherit; font-family:inherit;
    display:inline-flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap; }
  .ptab i { font-style:normal; opacity:.5; font-size:10px; }
  .ptab.on { background:#6ea1f7; color:#0d1017; border-color:#6ea1f7; }
  /* fixed controls (do not scroll with the tabs) */
  #panectl { display:flex; gap:6px; flex:0 0 auto; padding-left:6px; border-left:1px solid var(--line); }
  .pctl { flex:0 0 auto; background:#20242e; border:1px solid var(--line); color:var(--fg);
    border-radius:8px; padding:5px 8px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
  .pctl svg { width:16px; height:16px; }
  .pctl.armed { background:#e5484d; border-color:#e5484d; color:#fff; }
</style>
</head>
<body tabindex="0">
  <div id="bar">
    <span id="back" title="Sessions"><svg class="ic" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></span>
    <span id="dot" class="connecting"></span>
    <span id="title">…</span><span id="sub"></span>
    <span id="spacer"></span>
    <span class="btn" id="goto" title="Focus this pane in the terminal"><svg class="ic" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></span>
    <span class="btn" id="close" title="Close"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
  </div>
  <div id="panebar" hidden></div>
  <div id="term"><pre id="history"></pre><pre id="live"></pre></div>
  <textarea id="kbd" rows="1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" inputmode="text"></textarea>
  <div id="keys">
    <button data-k="bottom" id="kbottom" title="Jump to latest" hidden>⤓</button>
    <button data-k="attach" id="kattach" title="Attach photo / file">📎</button>
    <button data-k="paste">paste</button>
    <button data-k="esc">esc</button>
    <button data-k="ctrl" id="kctrl">ctrl</button>
    <button data-k="tab">tab</button>
    <button data-k="up">↑</button>
    <button data-k="down">↓</button>
    <button data-k="left">←</button>
    <button data-k="right">→</button>
    <button data-k="bs">⌫</button>
    <button data-k="cc">^C</button>
    <button data-k="enter">⏎</button>
    <button data-k="restart" id="krestart" title="Restart & resume">↻</button>
  </div>
  <input type="file" id="fileInput" multiple hidden>

  <div id="restartModal" class="rm-overlay" hidden>
    <div class="rm-card">
      <div class="rm-title">Restart &amp; resume</div>
      <div class="rm-desc">Stops the current agent and relaunches it resuming the last session in this pane.</div>
      <div class="rm-seg" id="rmSeg">
        <button data-acct="claude">Claude</button>
        <button data-acct="claude-work">Claude · work</button>
        <button data-acct="codex">Codex</button>
      </div>
      <div class="rm-actions">
        <button id="rmCancel" class="rm-btn">Cancel</button>
        <button id="rmGo" class="rm-btn rm-danger">Restart</button>
      </div>
    </div>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  let target = params.get('target') || '';
  const MOBILE = params.get('m') === '1' || matchMedia('(pointer:coarse)').matches;
  const ansi = new AnsiUp();
  const stripOSC = (t) => t.replace(/\x1b\]8;[^]*?(?:\x1b\\|\x07)(.*?)\x1b\]8;[^]*?(?:\x1b\\|\x07)/g,'$1').replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)/g,'');
  const renderAnsi = (t) => ansi.ansi_to_html(stripOSC(t)).replace(/^@@HRULE@@$/gm,'<span class="hrule"></span>');

  const term = document.getElementById('term');
  const historyPre = document.getElementById('history');
  const livePre = document.getElementById('live');
  const dot = document.getElementById('dot');
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const kbd = document.getElementById('kbd');
  document.title = 'PiP · ' + target;
  titleEl.textContent = target.split(':')[0] || target;
  subEl.textContent = target ? '· ' + target : '';

  // Mobile: solid dark background (native app supplies its own), key toolbar + back button.
  if (MOBILE) {
    document.body.classList.add('mobile');
    document.documentElement.style.setProperty('--bg', '#0d0f14');
    document.documentElement.style.setProperty('--bar', '#161922');
    document.getElementById('keys').style.display = 'flex';
    if (params.get('m') === '1') document.getElementById('back').style.display = 'inline-flex';
  }

  let ws, reconnectDelay = 500, lastContent = '';
  const atBottom = () => (term.scrollHeight - term.scrollTop - term.clientHeight) < 40;
  const toBottom = () => { term.scrollTop = term.scrollHeight; };
  // follow = auto-stick to bottom. Cleared when the user scrolls up to read,
  // re-armed when they scroll back down or tap to type. Prevents the yank-down.
  let follow = true;
  const kbottom = document.getElementById('kbottom');
  const updateScrollBtn = () => { kbottom.hidden = follow; };
  term.addEventListener('scroll', () => { follow = atBottom(); updateScrollBtn(); });
  const setStatus = (s) => { dot.className = s || 'connecting'; };

  // mobile: fit the monospace font so the widest line fits the pane width
  // (avoids wide TUI lines wrapping to 4-5 rows). Floor at 7px → horizontal scroll.
  const BASE_FS = 12.5, MIN_FS = 9;
  let fitPending = false;
  function fitFont() {
    if (!MOBILE) return;
    document.documentElement.style.setProperty('--fs', BASE_FS + 'px');
    const natural = Math.max(historyPre.scrollWidth, livePre.scrollWidth, 1);
    const avail = term.clientWidth - 20; // minus padding
    let f = BASE_FS;
    if (natural > avail) f = Math.max(MIN_FS, BASE_FS * avail / natural);
    document.documentElement.style.setProperty('--fs', f.toFixed(1) + 'px');
  }
  const scheduleFit = () => { if (fitPending) return; fitPending = true; requestAnimationFrame(() => { fitPending = false; fitFont(); }); };
  const sendRaw = (data) => { if (data && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'input', data })); };
  const send = (data) => {
    if (!data) return;
    sendRaw(data);
    follow = true; toBottom(); updateScrollBtn(); // typing/keys means we're at the prompt
  };

  // Scroll-forwarding: for full-screen TUI panes (alt-screen), the terminal only
  // exposes the current screen. When the user over-scrolls past the top, send
  // mouse-wheel events to the app so it scrolls its own transcript; we then
  // capture the revealed rows. Only for alt-screen panes (never a plain shell).
  let isAlt = false, scrollAccum = 0;
  const WHEEL_UP = '\x1b[<64;20;20M', WHEEL_DOWN = '\x1b[<65;20;20M';
  const forwardScroll = (dir) => { if (dir === 'up') { follow = false; updateScrollBtn(); } const s = dir === 'up' ? WHEEL_UP : WHEEL_DOWN; sendRaw(s + s + s); };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // Jump to the latest output. One big burst gets coalesced by the agent, so
  // send small spaced bursts until the captured content stops changing (bottom).
  async function jumpBottom() {
    follow = true; toBottom(); updateScrollBtn();
    if (!isAlt) return;
    let stable = 0;
    for (let i = 0; i < 35; i++) {
      const before = lastContent;
      sendRaw(WHEEL_DOWN.repeat(8));
      await sleep(200);                 // allow the capture round-trip (phone/tailscale latency)
      toBottom();
      // require 2 consecutive no-change ticks so a single laggy update
      // doesn't stop us mid-transcript
      if (lastContent === before) { if (++stable >= 2) break; } else stable = 0;
    }
  }

  // Sibling-pane switcher: list panes in this window (claude / nvim / shell / …)
  // and let the user flip the streamed target. The shell pane is a full terminal
  // for running commands, the editor pane shows nvim, etc.
  const panebar = document.getElementById('panebar');
  function markTabs() { panebar.querySelectorAll('.ptab').forEach((b) => b.classList.toggle('on', b.dataset.t === target)); }
  let killArmed = false, killTimer = null;
  async function loadPanes() {
    try {
      const list = await (await fetch('/api/panes/' + encodeURIComponent(target))).json();
      const panes = Array.isArray(list) ? list : [];
      // Always show the bar (so the +/✕ controls are reachable), even with one pane.
      panebar.hidden = panes.length === 0;
      const tabs = panes.map((p) =>
        `<button class="ptab" data-t="${p.target}">${(p.label || '').replace(/[<>&"]/g, '')}<i>.${p.target.split('.').pop()}</i></button>`).join('');
      const canKill = panes.length > 1; // never kill the last pane (would close the window)
      const ICON_ADD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>';
      const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>';
      panebar.innerHTML =
        '<div id="panetabs">' + tabs + '</div>' +
        '<div id="panectl">' +
        '<button class="pctl" id="paneAdd" title="New pane">' + ICON_ADD + '</button>' +
        (canKill ? '<button class="pctl pkill" id="paneKill" title="Remove current pane">' + ICON_X + '</button>' : '') +
        '</div>';
      panebar.querySelectorAll('#panetabs .ptab').forEach((b) => b.onclick = () => switchTo(b.dataset.t));
      const add = document.getElementById('paneAdd'); if (add) add.onclick = newPane;
      const kill = document.getElementById('paneKill'); if (kill) kill.onclick = armKill;
      killArmed = false;
      markTabs();
    } catch (_) {}
  }
  async function newPane() {
    try {
      const j = await (await fetch('/api/pane/new?target=' + encodeURIComponent(target), { method: 'POST' })).json();
      await loadPanes();
      if (j && j.target) switchTo(j.target);
    } catch (_) {}
  }
  function armKill() {
    const btn = document.getElementById('paneKill'); if (!btn) return;
    if (!killArmed) { // first tap arms (turns red); second within 3s confirms
      killArmed = true; btn.classList.add('armed'); btn.title = 'Tap again to remove';
      clearTimeout(killTimer);
      killTimer = setTimeout(() => { killArmed = false; btn.classList.remove('armed'); btn.title = 'Remove current pane'; }, 3000);
      return;
    }
    clearTimeout(killTimer); killArmed = false;
    removePane(target);
  }
  async function removePane(t) {
    try { await fetch('/api/pane/kill?target=' + encodeURIComponent(t), { method: 'POST' }); } catch (_) {}
    let list = [];
    try { list = await (await fetch('/api/panes/' + encodeURIComponent(t))).json(); } catch (_) {}
    const remain = (Array.isArray(list) ? list : []).filter((p) => p.target !== t);
    if (remain.length) {
      // Prefer the agent pane (claude, then codex), else the active/first one.
      const pick = remain.find((p) => p.label === 'claude') || remain.find((p) => p.label === 'codex')
        || remain.find((p) => p.active) || remain[0];
      switchTo(pick.target);
    } else { panebar.hidden = true; const bk = document.getElementById('back'); if (bk) bk.click(); }
  }
  function switchTo(t) {
    if (!t || t === target) return;
    try { if (ws) { ws.onclose = null; ws.close(); } } catch (_) {}
    target = t;
    historyPre.innerHTML = ''; livePre.innerHTML = ''; lastContent = ''; isAlt = false;
    document.title = 'PiP · ' + target;
    subEl.textContent = '· ' + target;
    reconnectDelay = 500; follow = true;
    markTabs();
    connect();
  }

  function connect() {
    setStatus('connecting');
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/${target}`);
    ws.onopen = () => { setStatus('idle'); reconnectDelay = 500; ws.send(JSON.stringify({type:'history-mode',data:'on'})); sendViewing(); };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'history') {
        historyPre.innerHTML = renderAnsi(msg.data);
        scheduleFit();
        if (follow) toBottom();
        if (msg.status) setStatus(msg.status);
      } else if (msg.type === 'content') {
        if (msg.data === lastContent) { if (msg.status) setStatus(msg.status); return; }
        lastContent = msg.data;
        livePre.innerHTML = renderAnsi(msg.data);
        scheduleFit();
        if (msg.status) setStatus(msg.status);
        if (follow) toBottom();
      } else if (msg.type === 'status-update') {
        if (msg.status) setStatus(msg.status);
      } else if (msg.type === 'alt') {
        isAlt = msg.data === '1';
      } else if (msg.type === 'status' && msg.data === 'disconnected') {
        setStatus('disconnected');
      }
    };
    ws.onclose = () => { setStatus('disconnected'); setTimeout(() => { reconnectDelay = Math.min(reconnectDelay*1.5, 8000); connect(); }, reconnectDelay); };
    ws.onerror = () => ws.close();
  }

  // hardware keyboard (desktop + phones with a BT keyboard)
  document.addEventListener('keydown', (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    let data = '';
    if (e.ctrlKey && !e.metaKey && e.key.length === 1) {
      const code = e.key.toLowerCase().charCodeAt(0) - 96;
      if (code > 0 && code < 27) { data = String.fromCharCode(code); e.preventDefault(); }
    } else if (e.key.length === 1 && !e.metaKey) {
      data = e.key; e.preventDefault();
    } else {
      switch (e.key) {
        case 'Enter': data = '\r'; break;
        case 'Backspace': data = '\x7f'; break;
        case 'Tab': data = e.shiftKey ? '\x1b[Z' : '\t'; e.preventDefault(); break;
        case 'Escape': data = '\x1b'; break;
        case 'ArrowUp': data = '\x1b[A'; break;
        case 'ArrowDown': data = '\x1b[B'; break;
        case 'ArrowRight': data = '\x1b[C'; break;
        case 'ArrowLeft': data = '\x1b[D'; break;
        case 'PageUp': data = '\x1b[5~'; break;
        case 'PageDown': data = '\x1b[6~'; break;
        case 'Home': data = '\x1b[H'; break;
        case 'End': data = '\x1b[F'; break;
        case 'Delete': data = '\x1b[3~'; break;
      }
      if (data) e.preventDefault();
    }
    send(data);
  });

  // soft keyboard (mobile): capture typed AND dictated text via input +
  // composition events. Crucially we do NOT preventDefault — that breaks Gboard
  // voice dictation (it composes into the field; blocking it drops the text).
  let ctrlArmed = false, composing = false, lastComposed = '', justComposed = false;
  const setCtrl = (on) => { ctrlArmed = on; document.getElementById('kctrl').classList.toggle('on', on); };
  const applyCtrl = (s) => {
    if (!ctrlArmed || !s) return s;
    setCtrl(false);
    if (s.length === 1) { const c = s.toLowerCase().charCodeAt(0) - 96; if (c > 0 && c < 27) return String.fromCharCode(c); }
    return s;
  };
  const flushKbd = () => { if (kbd.value) { send(applyCtrl(kbd.value)); kbd.value = ''; } };
  // stream the change from the last composition snapshot: backspace what changed,
  // send the new tail — so dictation lands word-by-word (and corrections replay).
  const streamDelta = (oldS, cur) => {
    let i = 0; const n = Math.min(oldS.length, cur.length);
    while (i < n && oldS[i] === cur[i]) i++;
    const del = oldS.length - i;
    if (del > 0) send('\x7f'.repeat(del));
    if (cur.length > i) send(cur.slice(i));
  };
  kbd.addEventListener('compositionstart', () => { composing = true; lastComposed = ''; });
  kbd.addEventListener('compositionupdate', (e) => {
    if (!composing) return;
    const cur = e.data || '';
    streamDelta(lastComposed, cur);
    lastComposed = cur;
  });
  kbd.addEventListener('compositionend', (e) => {
    composing = false;
    const finalStr = e.data || lastComposed;
    streamDelta(lastComposed, finalStr);               // final delta
    if (finalStr) send(' ');                            // space after each dictated phrase
    lastComposed = ''; kbd.value = '';
    justComposed = true; setTimeout(() => { justComposed = false; }, 0);
  });
  kbd.addEventListener('input', (e) => {
    if (composing) return;                              // handled by composition events
    if (justComposed) { justComposed = false; kbd.value = ''; return; } // swallow the post-commit input
    if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') { kbd.value = ''; send('\r'); return; }
    if (e.inputType === 'deleteContentBackward') { kbd.value = ''; send('\x7f'); return; }
    flushKbd();
  });

  document.addEventListener('paste', async (e) => {
    const dt = e.clipboardData || window.clipboardData;
    if (!dt) return;
    e.preventDefault();
    let files = [...(dt.files || [])];
    if (!files.length) files = [...(dt.items || [])].filter((i) => i.kind === 'file').map((i) => i.getAsFile()).filter(Boolean);
    if (files.length) { await sendFiles(files); return; }
    send(dt.getData('text'));
  });

  // key toolbar
  const KEYSEQ = { esc:'\x1b', tab:'\t', up:'\x1b[A', down:'\x1b[B', left:'\x1b[D', right:'\x1b[C', bs:'\x7f', cc:'\x03', enter:'\r' };
  document.getElementById('keys').addEventListener('mousedown', (e) => e.preventDefault()); // keep the field focused
  document.getElementById('keys').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const k = b.dataset.k;
    if (k === 'ctrl') { setCtrl(!ctrlArmed); kbd.focus({ preventScroll: true }); return; }
    if (k === 'bottom') { jumpBottom(); kbd.focus({ preventScroll: true }); return; } // jump to latest
    if (k === 'restart') { openRestart(); return; }   // confirm modal picks the account
    if (k === 'attach') { fileInput.click(); return; } // pick photo/file → upload → type its path
    if (k === 'paste') {                          // paste image/file (upload) or text
      pasteClipboard();
      kbd.focus({ preventScroll: true }); return;
    }
    send(KEYSEQ[k]);
    kbd.focus({ preventScroll: true });
  });

  document.getElementById('close').onclick = () => { try { ws && ws.close(); } catch(_){} window.close(); };
  document.getElementById('goto').onclick = () => { fetch('/api/goto/' + encodeURIComponent(target)).catch(()=>{}); };
  document.getElementById('back').onclick = () => { location.href = '/m.html'; };

  // ── restart & resume confirm modal ─────────────────────────────────────────
  const rm = document.getElementById('restartModal');
  const rmSeg = document.getElementById('rmSeg');
  let rmAcct = 'claude';
  const setAcct = (a) => { rmAcct = a; [...rmSeg.children].forEach(x => x.classList.toggle('on', x.dataset.acct === a)); };
  function openRestart() {
    try { document.activeElement && document.activeElement.blur(); } catch(_){}   // drop the soft keyboard so the sheet is visible
    setAcct('claude');
    fetch('/api/restart-agent/' + encodeURIComponent(target))               // preselect the detected account
      .then(r => r.json()).then(d => setAcct(d.account || 'claude')).catch(() => {});
    rm.hidden = false;
  }
  rmSeg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setAcct(b.dataset.acct); });
  document.getElementById('rmCancel').onclick = () => { rm.hidden = true; };
  rm.addEventListener('click', (e) => { if (e.target === rm) rm.hidden = true; });   // tap backdrop to dismiss
  document.getElementById('rmGo').onclick = () => {
    rm.hidden = true;
    fetch('/api/restart-agent/' + encodeURIComponent(target), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ account: rmAcct }),
    }).catch(() => {});
  };

  // ── attach / paste photo / file ─────────────────────────────────────────────
  // Upload picked or pasted files to the server, then type their saved paths
  // into the pane so Claude can read them (it reads images and files by path).
  const fileInput = document.getElementById('fileInput');
  const kattach = document.getElementById('kattach');
  const attachLabel = '📎';
  // state: false = idle, true = indeterminate spinner, number = percent
  // Build the spinner+label DOM ONCE when entering the busy state; later % ticks
  // update only the number. (Rebuilding innerHTML every tick restarted the CSS
  // animation each time, so the spinner looked frozen.)
  let attachBusy = false;
  const setAttach = (state) => {
    if (state === false) {
      attachBusy = false;
      kattach.disabled = false;
      kattach.textContent = attachLabel;
      return;
    }
    kattach.disabled = true;
    if (!attachBusy) {
      attachBusy = true;
      kattach.innerHTML = '<span class="spin"></span><span class="pn"></span>';
    }
    const pn = kattach.querySelector('.pn');
    if (pn) pn.textContent = (state === true) ? '' : state + '%';
  };

  // SHA-256 (hex) of a file's bytes — the dedup key (original content).
  async function sha256Hex(file) {
    try {
      const h = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
      return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
    } catch (_) { return ''; }
  }

  // XHR (not fetch) so we get real upload progress from upload.onprogress.
  function xhrUpload(file, hash, onProgress) {
    return new Promise((resolve) => {
      try {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/upload');
        xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded, e.total); };
        xhr.onload = () => { try { const j = JSON.parse(xhr.responseText); resolve(j && j.path ? j.path : ''); } catch (_) { resolve(''); } };
        xhr.onerror = () => resolve('');
        const ext = (file.type && file.type.includes('/')) ? '.' + file.type.split('/')[1] : '';
        const fd = new FormData();
        if (hash) fd.append('hash', hash);
        fd.append('file', file, file.name || ('paste-' + Date.now() + ext));
        xhr.send(fd);
      } catch (_) { resolve(''); }
    });
  }

  // Downscale/re-encode large images before upload so photos send fast. WebP
  // ~0.9 keeps text legible for Claude's vision; already-compressed images don't
  // benefit from gzip, so this (not server-side inflate) is the real speedup.
  async function maybeCompress(file) {
    if (!file.type || !file.type.startsWith('image/') || file.type === 'image/gif') return file;
    if (file.size < 400 * 1024) return file; // small already
    try {
      const bmp = await createImageBitmap(file);
      const MAX = 2048;
      const scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
      if (bmp.close) bmp.close();
      const blob = await new Promise((res) => canvas.toBlob(res, 'image/webp', 0.9));
      if (blob && blob.size < file.size) {
        return new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.webp', { type: 'image/webp' });
      }
    } catch (_) {}
    return file;
  }

  async function uploadFiles(files) {
    const results = new Array(files.length).fill('');
    const jobs = []; // files that actually need uploading: {idx, file, hash}
    for (let i = 0; i < files.length; i++) {
      const hash = await sha256Hex(files[i]);
      if (hash) {
        try {
          const j = await (await fetch('/api/upload/lookup?hash=' + hash)).json();
          if (j && j.path) { results[i] = j.path; continue; } // already on server — reuse, no upload
        } catch (_) {}
      }
      jobs.push({ idx: i, file: await maybeCompress(files[i]), hash });
    }
    const total = jobs.reduce((s, j) => s + (j.file.size || 0), 0);
    let done = 0;
    for (const j of jobs) {
      const p = await xhrUpload(j.file, j.hash, (loaded) => {
        if (total > 0) setAttach(Math.min(99, Math.round((done + loaded) / total * 100)));
      });
      done += j.file.size || 0;
      results[j.idx] = p;
    }
    return results.filter(Boolean);
  }

  async function sendFiles(files) {
    if (!files.length) return false;
    setAttach(true);                 // spinner until the first progress tick
    const paths = await uploadFiles(files);
    setAttach(false);
    if (paths.length) send(paths.join(' ') + ' ');
    return paths.length > 0;
  }

  fileInput.addEventListener('change', async () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    await sendFiles(files);
    kbd.focus({ preventScroll: true });
  });

  // Paste: prefer image/file on the clipboard (upload it), else fall back to text.
  async function pasteClipboard() {
    if (navigator.clipboard && navigator.clipboard.read) {
      try {
        const items = await navigator.clipboard.read();
        const blobs = [];
        let text = '';
        for (const it of items) {
          const imgType = it.types.find((t) => t.startsWith('image/'));
          if (imgType) {
            const b = await it.getType(imgType);
            blobs.push(new File([b], 'paste.' + (imgType.split('/')[1] || 'png'), { type: imgType }));
          } else if (it.types.includes('text/plain')) {
            text += await (await it.getType('text/plain')).text();
          }
        }
        if (blobs.length) { await sendFiles(blobs); return; }
        if (text) { send(text); return; }
      } catch (_) { /* fall through to text */ }
    }
    if (navigator.clipboard && navigator.clipboard.readText) {
      try { const t = await navigator.clipboard.readText(); if (t) send(t); } catch (_) {}
    }
  }

  // focus: desktop keeps body focused; mobile focuses the hidden field to raise
  // the keyboard. preventScroll stops the browser jumping to the 1px field.
  window.addEventListener('load', () => { if (!MOBILE) document.body.focus(); }); // don't auto-raise the keyboard on phones
  // A click fires on a tap but not after a scroll gesture (browser suppresses it),
  // and is a user gesture so focus() reliably raises the soft keyboard.
  term.addEventListener('click', () => {
    if (MOBILE) { follow = true; kbd.focus({ preventScroll: true }); toBottom(); }
    else document.body.focus();
  });

  // keyboard open/close resizes the visual viewport — shrink the app to the
  // visible area, re-pinning to bottom only when following.
  if (MOBILE && window.visualViewport) {
    const vv = window.visualViewport;
    const fit = () => { document.body.style.height = vv.height + 'px'; scheduleFit(); };
    vv.addEventListener('resize', () => { fit(); if (follow) toBottom(); });
    fit();
  }
  window.addEventListener('orientationchange', scheduleFit);

  // desktop wheel: at the top, wheel-up scrolls the app's transcript; at the
  // bottom, wheel-down. Only for alt-screen panes.
  term.addEventListener('wheel', (e) => {
    if (!isAlt) return;
    if (e.deltaY < 0 && term.scrollTop <= 0) forwardScroll('up');
    else if (e.deltaY > 0 && atBottom()) forwardScroll('down');
  }, { passive: true });

  // mobile: over-scroll past the top/bottom forwards a wheel event to the app
  let tY = null;
  term.addEventListener('touchstart', (e) => { tY = e.touches[0].clientY; scrollAccum = 0; }, { passive: true });
  term.addEventListener('touchmove', (e) => {
    if (!isAlt || tY == null) return;
    const y = e.touches[0].clientY, dy = y - tY; tY = y;
    if (term.scrollTop <= 0 && dy > 0) { scrollAccum += dy; if (scrollAccum > 28) { scrollAccum = 0; forwardScroll('up'); } }
    else if (atBottom() && dy < 0) { scrollAccum -= dy; if (scrollAccum > 28) { scrollAccum = 0; forwardScroll('down'); } }
  }, { passive: true });

  // tell the server we're actively viewing this pane, so it suppresses pushes
  // for it while the tab is open + visible.
  const sendViewing = () => { if (!document.hidden && ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'viewing' })); };
  setInterval(sendViewing, 8000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) sendViewing(); });

  // keep the screen awake while watching a pane on mobile
  let wakeLock = null;
  async function acquireWake() {
    if (!MOBILE || !('wakeLock' in navigator) || document.hidden) return;
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) acquireWake(); });
  acquireWake();

  if (!target) { livePre.textContent = 'no ?target= given'; } else { connect(); loadPanes(); setInterval(loadPanes, 10000); }
</script>
</body>
</html>
