<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Wall</title>
<script>
  // Phones and small touch screens get the mobile UI; ?desktop=1 (saved) forces this page.
  (function () {
    try {
      if (location.search.indexOf('desktop=1') >= 0) { localStorage.setItem('cw-force-desktop', '1'); }
      if (localStorage.getItem('cw-force-desktop') === '1') return;
      if (matchMedia('(max-width:640px)').matches && matchMedia('(pointer:coarse)').matches) location.replace('/m.html');
    } catch (e) {}
  })();
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#141720">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Terminal glyph fallbacks shipped with the server (prompt icons, Claude Code's ⎿ ⏺ ✻). */
  @font-face { font-family:"CW Mono"; src:url(/fonts/cw-mono.woff2) format("woff2"); font-display:swap;
    unicode-range:U+20-7E,U+A0-24F,U+2000-206F,U+20A0-20CF,U+2190-21FF,U+2500-25FF; }
  @font-face { font-family:"CW Mono"; src:url(/fonts/cw-mono-icons.woff2) format("woff2"); font-display:swap; unicode-range:U+E000-F8FF; }
  @font-face { font-family:"CW Mono"; src:url(/fonts/cw-mono-material.woff2) format("woff2"); font-display:swap; unicode-range:U+F0000-F1AF0; }
  @font-face { font-family:"CW Symbols"; src:url(/fonts/cw-symbols.woff2) format("woff2"); font-display:swap;
    unicode-range:U+250-3FF,U+2000-2BFF,U+2E00-2E7F,U+1F100-1F1FF; }

  :root {
    --night:#0d0f14; --slate:#141720; --raised:#1b1f29; --raised2:#222734; --hover:#262b38;
    --line:#252a35; --line2:#323848;
    --ink:#eef0f5; --muted:#8b91a3; --dim:#5b6172;
    --go:#57d977; --ask:#e5566a; --rest:#e8b93b; --act:#f5a742; --sel:#6ea1f7; --codex:#8b7cf0;
    --ui:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --cond:'Barlow Semi Condensed','Barlow',-apple-system,BlinkMacSystemFont,sans-serif;
    --term:'SF Mono',SFMono-Regular,Menlo,Monaco,Consolas,'CW Mono','CW Symbols',monospace;
    --r-tile:10px; --r-ctl:7px; --r-menu:10px;
    --roster-w:284px; --inbox-w:360px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { background:var(--night); color:var(--ink); font:14px/1.4 var(--ui); display:flex; flex-direction:column;
    overflow:hidden; -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  input, select, textarea { font:inherit; color:var(--ink); }
  a { color:inherit; }
  .ic { width:16px; height:16px; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; fill:none; flex:0 0 auto; }
  :focus-visible { outline:2px solid var(--sel); outline-offset:1px; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:var(--line2); border-radius:4px; }
  ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background:transparent; }

  /* status colour per element: data-s = working | permission | error | recent | idle | connecting | disconnected */
  [data-s] { --s:var(--dim); }
  [data-s="working"] { --s:var(--go); }
  [data-s="permission"], [data-s="error"], [data-s="disconnected"] { --s:var(--ask); }
  [data-s="recent"] { --s:var(--act); }

  /* ── Buttons ── */
  .btn { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 11px; border-radius:var(--r-ctl);
    font:600 13.5px var(--cond); letter-spacing:.1px; color:var(--ink); background:var(--raised); border:1px solid var(--line);
    white-space:nowrap; }
  .btn:hover { background:var(--hover); border-color:var(--line2); }
  .btn.primary { background:var(--act); border-color:var(--act); color:#1a1206; }
  .btn.primary:hover { background:#ffb658; }
  .btn.ghost { background:none; border-color:transparent; color:var(--muted); }
  .btn.ghost:hover { background:var(--raised); color:var(--ink); }
  .btn.danger { color:var(--ask); }
  .btn.danger.solid { background:var(--ask); border-color:var(--ask); color:#fff; }
  .btn .kbd { font:600 11px var(--cond); color:var(--dim); border:1px solid var(--line2); border-radius:4px; padding:0 4px; line-height:16px; }
  .btn .count { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--ask); color:#fff;
    font:700 11.5px/18px var(--cond); text-align:center; }
  .btn.on { color:var(--ink); background:var(--raised2); border-color:var(--line2); }
  .iconbtn { width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:6px; color:var(--muted); flex:0 0 auto; }
  .iconbtn:hover { background:var(--hover); color:var(--ink); }
  .iconbtn.armed { background:var(--ask); color:#fff; }

  /* ── Top bar ── */
  #topbar { height:50px; flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:0 12px 0 14px;
    background:var(--slate); border-bottom:1px solid var(--line); position:relative; z-index:30; }
  .brand { display:flex; align-items:center; gap:9px; flex:0 0 auto; font:700 16px var(--cond); letter-spacing:.2px; }
  .brand img { width:24px; height:24px; border-radius:6px; }

  /* The rack: one slot per agent, in number order. The LED is the status; only waiting slots blink. */
  #rack { flex:1 1 auto; min-width:60px; max-width:600px; display:flex; align-items:stretch; gap:3px; height:32px;
    padding:3px; background:var(--night); border:1px solid var(--line); border-radius:8px; }
  .rk { flex:1 1 22px; min-width:5px; max-width:24px; border-radius:4px; background:var(--raised); position:relative;
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:1px;
    font:600 10.5px/1 var(--cond); color:var(--dim); overflow:hidden; }
  .rk::before { content:''; position:absolute; left:3px; right:3px; top:3px; height:5px; border-radius:2px; background:var(--s); opacity:.55; }
  .rk[data-s="working"]::before { opacity:1; box-shadow:0 0 7px var(--go); }
  .rk[data-s="permission"]::before, .rk[data-s="error"]::before { opacity:1; box-shadow:0 0 8px var(--ask); animation:blink 1.1s steps(2,jump-none) infinite; }
  .rk[data-s="recent"]::before { opacity:1; }
  .rk.wall { background:var(--raised2); color:var(--muted); }
  .rk.sel { box-shadow:inset 0 0 0 1.5px var(--sel); color:var(--ink); }
  .rk:hover { background:var(--hover); color:var(--ink); }
  #rack.dense .rk { font-size:0; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:.25; } }

  #meters { display:flex; align-items:center; gap:12px; flex:0 0 auto; font:500 12.5px var(--cond); color:var(--muted); }
  #meters.offline { opacity:.4; }
  .mt { display:flex; align-items:center; gap:5px; white-space:nowrap; }
  .mt b { font-weight:600; color:var(--ink); min-width:28px; }
  .mt.warn b { color:var(--rest); } .mt.crit b { color:var(--ask); }
  .mt .bar { width:22px; height:4px; border-radius:2px; background:var(--raised2); overflow:hidden; }
  .mt .bar i { display:block; height:100%; width:0; background:var(--sel); transition:width .4s; }
  .mt.warn .bar i { background:var(--rest); } .mt.crit .bar i { background:var(--ask); }
  .mt.net b { min-width:0; color:var(--muted); font-weight:500; }
  .tb-actions { display:flex; align-items:center; gap:6px; flex:0 0 auto; margin-left:auto; }
  #search-open { min-width:190px; justify-content:space-between; color:var(--muted); font-family:var(--ui); font-weight:500; }
  #inbox-btn .count[hidden] { display:none; }

  /* ── Body columns ── */
  #main { flex:1 1 auto; min-height:0; display:flex; position:relative; }

  /* Roster: every agent, attention first */
  #roster { width:var(--roster-w); flex:0 0 auto; display:flex; flex-direction:column; background:var(--slate);
    border-right:1px solid var(--line); min-height:0; }
  body.no-roster #roster { display:none; }
  .ro-head { padding:10px 10px 8px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
  .field { display:flex; align-items:center; gap:7px; height:32px; padding:0 9px; background:var(--night);
    border:1px solid var(--line); border-radius:var(--r-ctl); color:var(--muted); }
  .field:focus-within { border-color:var(--sel); }
  .field input { flex:1; min-width:0; background:none; border:0; outline:none; font-size:13.5px; }
  .field input::placeholder { color:var(--dim); }
  .field .kbd { font:600 11px var(--cond); color:var(--dim); border:1px solid var(--line2); border-radius:4px; padding:0 4px; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 8px; border-radius:12px;
    font:600 12.5px var(--cond); color:var(--muted); background:var(--raised); border:1px solid var(--line); }
  .chip i { width:7px; height:7px; border-radius:50%; background:var(--s); }
  .chip b { font-weight:700; color:var(--ink); }
  .chip:hover { border-color:var(--line2); color:var(--ink); }
  .chip.on { background:var(--ink); color:var(--night); border-color:var(--ink); }
  .chip.on b { color:var(--night); }
  .ro-top { display:flex; gap:6px; align-items:center; }
  .ro-top .field { flex:1; min-width:0; }
  .tabs-close { align-self:center; margin:0 0 4px 4px; }
  #roster-btn { margin-left:-4px; }
  #roster-btn.on { color:var(--ink); }
  .ro-group { display:flex; gap:6px; }
  .ro-group select { flex:1; min-width:0; height:28px; padding:0 6px; background:var(--night); border:1px solid var(--line);
    border-radius:var(--r-ctl); font-size:13px; color:var(--muted); outline:none; }
  #roster-list { flex:1 1 auto; overflow-y:auto; min-height:0; }
  .row { display:grid; grid-template-columns:20px 1fr auto; gap:0 9px; padding:9px 10px 9px 12px; position:relative;
    border-bottom:1px solid var(--line); cursor:pointer; }
  .row::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--s); opacity:.85; }
  .row[data-s="idle"]::before, .row[data-s="connecting"]::before { opacity:0; }
  .row:hover { background:var(--raised); }
  .row.sel { background:var(--raised2); box-shadow:inset 0 0 0 1px var(--line2); }
  .row-num { font:600 12px/20px var(--cond); color:var(--dim); text-align:center; border-radius:5px; height:20px; background:var(--night); }
  .row.wall .row-num { background:var(--raised2); color:var(--ink); }
  .row-main { min-width:0; }
  .row-l1 { display:flex; align-items:center; gap:6px; min-width:0; }
  .row-name { font:600 15px/20px var(--cond); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .row-pane { font:500 11.5px var(--cond); color:var(--dim); flex:0 0 auto; }
  .agent-mark { width:14px; height:14px; flex:0 0 auto; display:inline-flex; }
  .agent-mark svg { width:14px; height:14px; }
  .prof { flex:0 0 auto; font:700 10.5px var(--cond); color:var(--sel); background:rgba(110,161,247,.14); border-radius:4px; padding:0 5px; line-height:16px; }
  .row-l2 { font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }
  .row-l2 .br { color:#a9a0f0; }
  .row-l3 { display:flex; align-items:center; gap:7px; margin-top:4px; font:600 12.5px var(--cond); color:var(--s); min-width:0; }
  .row[data-s="idle"] .row-l3 { color:var(--dim); }
  .row-l3 .txt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .pbar { flex:1 1 auto; min-width:30px; max-width:90px; height:4px; border-radius:2px; background:var(--raised2); overflow:hidden; }
  .pbar i { display:block; height:100%; background:var(--go); }
  .row-side { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .row-tools { display:flex; gap:2px; opacity:0; }
  .row:hover .row-tools, .row.sel .row-tools { opacity:1; }
  .row-tools .iconbtn { width:24px; height:24px; }
  .row-tools .iconbtn .ic { width:14px; height:14px; }
  .star.on { color:#f5b301; opacity:1; } .star.on .ic { fill:#f5b301; }
  .row .star.on { display:inline-flex; }
  .badges { display:flex; gap:4px; }
  .bdg { font:600 11px/16px var(--cond); padding:0 5px; border-radius:4px; background:var(--raised2); color:var(--muted); white-space:nowrap; }
  .bdg.sch { color:var(--sel); background:rgba(110,161,247,.12); }
  .bdg.pm b { color:var(--go); font-weight:700; }
  .ro-empty { padding:28px 16px; color:var(--muted); font-size:13px; text-align:center; }
  .ro-foot { border-top:1px solid var(--line); padding:8px 10px; display:flex; align-items:center; gap:6px; font:500 12.5px var(--cond); color:var(--muted); }
  .ro-foot span { flex:1; }
  .ro-foot span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .ro-foot .btn { height:26px; padding:0 7px; font-size:12.5px; flex:0 0 auto; }

  /* Wall: free-form layout of the agents you put on it */
  #wall { flex:1 1 auto; min-width:0; position:relative; overflow:hidden; background:var(--night); }
  #parking { display:none; }
  .wall-empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:var(--muted); font-size:14px; text-align:center; padding:20px; }
  .wall-empty h2 { font:600 20px var(--cond); color:var(--ink); }
  .wall-empty p { max-width:420px; }
  .wall-empty .acts { display:flex; gap:8px; }
  #wall > .tile { position:absolute;
    left:calc(6px + var(--x,0) * (100% - 9px)); top:calc(6px + var(--y,0) * (100% - 9px));
    width:calc(var(--w,1) * (100% - 9px) - 3px); height:calc(var(--h,1) * (100% - 9px) - 3px); }
  #wall > .tile.zoomed { left:6px; top:6px; width:calc(100% - 12px); height:calc(100% - 12px); z-index:25; }

  .tile { background:var(--slate); border:1px solid var(--line); border-radius:var(--r-tile); display:flex; flex-direction:column;
    min-width:0; min-height:0; overflow:visible; }
  .tile.active { border-color:var(--sel); box-shadow:0 0 0 1px var(--sel); }
  .tile[data-s="permission"], .tile[data-s="error"] { border-color:var(--ask); box-shadow:0 0 0 1px var(--ask), 0 0 26px -6px rgba(229,86,106,.45); }
  .tile.removing { opacity:0; transition:opacity .3s; }
  .tile-ghost { opacity:.25; }

  .t-head { height:34px; flex:0 0 auto; display:flex; align-items:center; gap:7px; padding:0 4px 0 10px; min-width:0;
    border-bottom:1px solid var(--line); border-radius:var(--r-tile) var(--r-tile) 0 0; cursor:grab; user-select:none;
    box-shadow:inset 3px 0 0 var(--s); font-size:13px; color:var(--muted); }
  .tile[data-s="idle"] .t-head, .tile[data-s="connecting"] .t-head { box-shadow:none; }
  .t-head:active { cursor:grabbing; }
  .tile-num { font:600 11.5px/18px var(--cond); color:var(--muted); background:var(--night); border-radius:4px; min-width:18px; text-align:center; flex:0 0 auto; }
  .session { font:600 15px var(--cond); color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:30px; flex:0 1 auto; }
  .dir { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 2 auto; min-width:0; }
  .branch { color:#a9a0f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:0 3 auto; min-width:0; font-size:12.5px; }
  .pane-id { color:var(--dim); font:500 11.5px var(--cond); flex:0 0 auto; }
  .status-label { font:600 12.5px var(--cond); color:var(--s); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:0 4 auto; }
  .status-label:empty { display:none; }
  .t-head .spacer { flex:1 1 0; min-width:4px; }
  .perm-mode { font:700 11px/16px var(--cond); padding:0 6px; border-radius:4px; flex:0 0 auto; }
  .perm-mode:empty { display:none; }
  .perm-mode.mode-bypass { color:var(--ask); background:rgba(229,86,106,.13); }
  .perm-mode.mode-plan { color:#67e8f9; background:rgba(103,232,249,.11); }
  .perm-mode.mode-edits { color:#b7a8ff; background:rgba(167,139,250,.13); }
  .perm-mode.mode-default { color:var(--dim); background:var(--raised); }
  .pm-badge, .sched-badge { flex:0 0 auto; }
  .t-btns { display:flex; gap:0; flex:0 0 auto; }
  .t-btns .iconbtn { width:26px; height:26px; }
  .t-btns .iconbtn .ic { width:15px; height:15px; }
  .tile.blurred .tile-body { filter:blur(6px); pointer-events:none; }
  .tile.blurred .session, .tile.blurred .dir, .tile.blurred .branch, .tile.blurred .pane-id, .tile.blurred .status-label, .tile.blurred .t-ask { filter:blur(5px); }

  /* Approval bar inside a waiting tile */
  .t-ask { flex:0 0 auto; display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:7px 10px;
    background:rgba(229,86,106,.09); border-bottom:1px solid rgba(229,86,106,.3); font-size:13px; }
  .t-ask .q { flex:1 1 220px; min-width:0; color:var(--ink); }
  .t-ask .q b { font:700 12.5px var(--cond); color:var(--ask); margin-right:6px; }
  .t-ask .q code { font:12px var(--term); color:var(--muted); word-break:break-all; }
  .ab { height:28px; padding:0 10px; border-radius:6px; font:600 13px var(--cond); border:1px solid var(--line2); background:var(--raised); }
  .ab:hover { background:var(--hover); }
  .ab.yes { background:var(--go); border-color:var(--go); color:#06210f; }
  .ab.yes:hover { background:#6ee98c; }
  .ab.always { color:var(--go); border-color:rgba(87,217,119,.4); }
  .ab.no { color:var(--ask); border-color:rgba(229,86,106,.4); }
  .ab.opt { text-align:left; height:auto; min-height:28px; padding:4px 10px; }
  .ab.opt small { display:block; font:400 11.5px var(--ui); color:var(--muted); }
  .ab.opt b { font-weight:700; color:var(--act); margin-right:4px; }
  .other-input { height:28px; padding:0 8px; background:var(--night); border:1px solid var(--line2); border-radius:6px; outline:none; font-size:13px; min-width:160px; flex:1; }

  .tile-body { flex:1 1 auto; min-height:0; overflow:auto; position:relative; background:var(--night);
    font-family:var(--term); font-size:12px; line-height:1.45; border-radius:0 0 var(--r-tile) var(--r-tile); }
  .tile-body:focus { outline:none; }
  .tile.active .tile-body:focus { box-shadow:inset 0 0 0 1px rgba(110,161,247,.25); }
  .tile-body pre { margin:0; padding:0 10px; white-space:pre-wrap; overflow-wrap:break-word; color:var(--ink);
    font:inherit; background:transparent; }
  .tile-body pre.history { padding-top:6px; opacity:.78; }
  .tile-body pre.live { padding-bottom:8px; }
  .tile-body .hrule { display:block; height:1px; background:var(--line2); margin:2px -10px; width:calc(100% + 20px); }

  .fabs { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:6px; z-index:5; }
  .fabs .fab { opacity:0; transition:opacity .15s; }
  .tile:hover .fabs .fab, .fabs.keep .fab, .fabs .fab.f-down { opacity:1; }
  .fab.f-down { background:var(--sel); border-color:var(--sel); color:#0d0f14; }
  .fab.f-down:hover { background:#8ab4ff; color:#0d0f14; }
  .fab { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    background:var(--raised); border:1px solid var(--line2); color:var(--muted); }
  .fab:hover { color:var(--ink); background:var(--hover); }
  .fab.rec { color:var(--ask); border-color:var(--ask); animation:blink 1s infinite; }
  .fab.busy { color:var(--act); font:700 10px var(--cond); }
  .fab.hidden { display:none; }
  .drop-overlay { position:absolute; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:rgba(110,161,247,.16); border:2px dashed var(--sel); border-radius:inherit; pointer-events:none;
    font:600 16px var(--cond); color:var(--sel); }
  .tile.drag-over .drop-overlay { display:flex; }

  /* Free-form resize handles */
  .rz { position:absolute; z-index:7; }
  .rz-e { top:0; bottom:0; right:-5px; width:8px; cursor:col-resize; } .rz-w { top:0; bottom:0; left:-5px; width:8px; cursor:col-resize; }
  .rz-s { left:0; right:0; bottom:-5px; height:8px; cursor:row-resize; } .rz-n { left:0; right:0; top:-5px; height:8px; cursor:row-resize; }
  .rz-se, .rz-sw, .rz-ne, .rz-nw { width:12px; height:12px; z-index:8; }

function ago(sec) {
  if (!sec) return '';
  const d = Math.max(0, Date.now() / 1000 - sec);

  if (d < 3600) return Math.round(d / 60) + 'm ago';
  if (d < 86400) return Math.round(d / 3600) + 'h ago';

}

// pollVisible runs fn every ms while the page shows, and once when it shows again.
function pollVisible(fn, ms) {
  setInterval(() => { if (!document.hidden) fn(); }, ms);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fn(); });
}

// Tile frames render once per animation frame, in three passes (measure, write, scroll).
const renderQueue = new Set();
let renderFrame = 0;
function queueRender(r) { renderQueue.add(r); if (!renderFrame) renderFrame = requestAnimationFrame(flushRenders); }
function flushRenders() {
  renderFrame = 0;
  const rs = [...renderQueue]; renderQueue.clear();
  for (const r of rs) r.measure();
  for (const r of rs) r.write();
  for (const r of rs) r.scroll();
}

let toastTimer = 0;
function toast(msg, ms = 2200) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {

      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch (_) { return false; }
  }
}

const dlgStack = [];

  document.body.appendChild(ov);
  const d = {
    el: ov, box: ov.firstElementChild, body: ov.querySelector('.dlg-b'),

let menuEl = null, menuAnchor = null;

// items: {label, icon, hint, danger, action} | {sep:true} | {header:'…'} | {el: HTMLElement}
function openMenu(anchor, items) {

  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  for (const it of items) {

    if (it.header) { m.insertAdjacentHTML('beforeend', `<div class="mlabel">${esc(it.header)}</div>`); continue; }
    if (it.info) { m.insertAdjacentHTML('beforeend', `<div class="minfo">${esc(it.info)}</div>`); continue; }
    if (it.el) { m.appendChild(it.el); continue; }
    const b = document.createElement('button');

    b.innerHTML = `${it.icon ? icon(it.icon) : '<span style="width:16px"></span>'}<span>${esc(it.label)}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}`;
    b.addEventListener('click', (e) => { e.stopPropagation(); if (!it.keep) closeMenu(); it.action && it.action(); });
    m.appendChild(b);
  }
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;

}

let notifsEnabled = LS.get('cw-notifs') !== 'off';

// ═══ Agents ═══
const agents = new Map();          // target → tile state (creation order = agent number)
const summary = new Map();         // target → {status, stoppedAt, activity} from /api/summary
let tileCounter = 0;
let selected = null;               // selected agent target
let favs = new Set(LS.json('cw_favs', []));    // shared with the mobile list
const wallPref = LS.json('cw2-wall', {});       // target → on the wall?
const filters = { q: '', chip: ['all', 'permission', 'working', 'recent', 'idle'].includes(LS.get('cw2-chip')) ? LS.get('cw2-chip') : 'all', group: '' };
const wall = $('#wall'), parking = $('#parking');

// recent = stopped working less than 30 min ago. The server decides it (recentWindow in web.go) for every client.
const RECENT_SEC = 30 * 60;
const WORD = { working: 'Working', permission: 'Waiting for you', error: 'Error', recent: 'Recent', idle: 'Idle',
  connecting: 'Connecting', disconnected: 'Offline' };

function dispStatus(st) {
  const s = st.status;
  if (st.offline) return 'disconnected';
  if (s === 'permission' || s === 'error' || s === 'working') return s;
  const sum = summary.get(st.pane.target);
  if (!st.seen && sum) {                       // websocket not ready yet: trust the summary
    if (sum.status === 'pending') return 'permission';
    if (sum.status && WORD[sum.status]) return sum.status;
  }
  if (sum && sum.status === 'recent') return 'recent';
  // The summary is polled every 4 s: a tile that just stopped is recent at once.
  if (st.stoppedLocal && (!sum || sum.status === 'working') && Date.now() / 1000 - st.stoppedLocal < RECENT_SEC) return 'recent';
  return st.seen ? 'idle' : 'connecting';
}
function activityOf(st) { return st.activity || (summary.get(st.pane.target) || {}).activity || ''; }
function stoppedAtOf(st) { return (summary.get(st.pane.target) || {}).stoppedAt || st.stoppedLocal || 0; }
function labelFor(st) {
  const s = dispStatus(st);
  if (s === 'working') return activityOf(st) || 'Working';
  if (s === 'recent') return 'Stopped ' + ago(stoppedAtOf(st) || Date.now() / 1000);
  if (s === 'idle' || s === 'connecting') return '';
  return WORD[s] || s;
}
function numberOf(target) { const st = agents.get(target); return st ? st.num : 0; }

function getProjectGroup(dir) {
  const parts = (dir || '').split('/').filter(Boolean);
  for (let i = parts.length - 1; i >= 0; i--) {
    if (['PROJECTS', 'WORK', 'PERSONAL', 'DESKTOP'].includes(parts[i].toUpperCase()) && i + 1 < parts.length) return parts[i + 1];
  }
  return parts.length >= 2 ? parts[parts.length - 2] : 'Other';
}
function searchText(st) {
  const p = st.pane;
  return [p.session, p.dirName, p.branch, p.target, p.agent, p.profile].join(' ').toLowerCase();
}
// Search and project group filter the list and the wall; the status chips filter the list only,
// so a tile you type in never disappears when its status changes.
function passesShared(st) {
  if (filters.q && !searchText(st).includes(filters.q)) return false;
  if (filters.group && getProjectGroup(st.pane.dir) !== filters.group) return false;
  return true;
}
function passesChip(st) {
  const s = dispStatus(st), c = filters.chip;
  if (c === 'all') return true;
  if (c === 'permission') return s === 'permission' || s === 'error';
  if (c === 'idle') return s === 'idle' || s === 'connecting' || s === 'disconnected';
  return s === c;
}

// ── Wall membership ──
function isOnWall(t) { return !!wallPref[t]; }
function saveWallPref() { LS.set('cw2-wall', JSON.stringify(wallPref)); }
function setOnWall(t, on, { focus = false } = {}) {
  const st = agents.get(t);
  if (!st) return;
  if (!!wallPref[t] !== on) { wallPref[t] = on; saveWallPref(); }
  const tile = st.tile;
  if (on && tile.parentElement !== wall) {

    st.flushPending();
    setTimeout(() => { st.body.scrollTop = st.body.scrollHeight; }, 60);
  } else if (!on && tile.parentElement !== parking) {

}
function saveOrder() {
  const onWall = $$('.tile', wall).map(el => el.dataset.t);
  const prev = LS.json('cw2-order', []);

// ═══ Wall layout (free-form rects in 0..1 units; v1 behaviour, own storage keys) ═══
let gridShape = { cols: 1, rows: 1, rects: [] };
const layoutKey = (n) => `cw2-rects-${n}`;
const EPS = 1e-4;
const near = (a, b) => Math.abs(a - b) < EPS;
function visibleGridTiles() { return $$('.tile', wall).filter(t => t.style.display !== 'none'); }
function defaultRects(n, cols, rows) {
  return Array.from({ length: n }, (_, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const span = i === n - 1 ? cols - col : 1;
    return { x: col / cols, y: row / rows, w: span / cols, h: 1 / rows };
  });
}
function loadRects(n, cols, rows) {
  const saved = LS.json(layoutKey(n), null);
  if (Array.isArray(saved) && saved.length === n && saved.every(r => r && r.w > 0 && r.h > 0 && r.x >= -EPS && r.y >= -EPS)) return saved;
  return defaultRects(n, cols, rows);
}
function placeTiles(list) {
  list.forEach((t, i) => {
    const r = gridShape.rects[i];
    if (!r) return;
    t.style.setProperty('--x', r.x); t.style.setProperty('--y', r.y);
    t.style.setProperty('--w', r.w); t.style.setProperty('--h', r.h);
    t.classList.toggle('no-w', r.x <= EPS); t.classList.toggle('no-n', r.y <= EPS);
    t.classList.toggle('no-e', r.x + r.w >= 1 - EPS); t.classList.toggle('no-s', r.y + r.h >= 1 - EPS);
  });
}
function updateGridLayout() {
  const list = visibleGridTiles(), n = list.length;
  $('#wall-empty').hidden = n > 0;
  if (n === 0) return;
  const wide = wall.clientWidth > wall.clientHeight * 1.6;
  let cols = Math.ceil(Math.sqrt(n));
  if (n === 2 && wide) cols = 2;
  const rows = Math.ceil(n / cols);
  gridShape = { cols, rows, rects: loadRects(n, cols, rows) };
  placeTiles(list);
}
function updateWall() {
  for (const [, st] of agents) {
    if (st.tile.parentElement !== wall) continue;
    const disp = passesShared(st) ? '' : 'none';
    if (st.tile.style.display !== disp) { st.tile.style.display = disp; if (st.sendHistoryMode) st.sendHistoryMode(); }
  }
  updateGridLayout();
  const on = [...agents.keys()].filter(isOnWall).length;
  $('#wall-count').textContent = `Wall: ${on} of ${agents.size}`;
  $('#wall-count').title = `${on} of ${agents.size} agents are on the wall`;
  const we = $('#wall-empty');
  if (!we.hidden) {
    $('h2', we).textContent = on ? 'No agent on the wall matches the search' : 'The wall is empty';
  }
}
function edgeGroups(rects, start, side, axis) {
  const [p, s, q, t] = axis === 'x' ? ['x', 'w', 'y', 'h'] : ['y', 'h', 'x', 'w'];
  const r0 = rects[start];
  const coord = side === 'end' ? r0[p] + r0[s] : r0[p];
  const before = new Set(), after = new Set();
  (side === 'end' ? before : after).add(start);
  const overlaps = (a, b) => a[q] < b[q] + b[t] - EPS && b[q] < a[q] + a[t] - EPS;
  let grew = true;
  while (grew) {
    grew = false;
    rects.forEach((r, i) => {
      if (before.has(i) || after.has(i)) return;
      if (near(r[p] + r[s], coord) && [...after].some(j => overlaps(r, rects[j]))) { before.add(i); grew = true; }
      else if (near(r[p], coord) && [...before].some(j => overlaps(r, rects[j]))) { after.add(i); grew = true; }
    });
  }
  return { coord, before: [...before], after: [...after], p, s };
}
wall.addEventListener('pointerdown', (e) => {
  const handle = e.target.closest('.rz');
  if (!handle || e.button !== 0) return;
  const tile = handle.closest('.tile');
  if (!tile || tile.parentElement !== wall) return;
  e.preventDefault(); e.stopPropagation();
  const tilesArr = visibleGridTiles();
  const idx = tilesArr.indexOf(tile);
  if (idx < 0) return;
  const dir = handle.dataset.rz;
  const start = gridShape.rects.map(r => ({ ...r }));
  const r0 = start[idx];
  const groups = [];
  if (dir.includes('e') && r0.x + r0.w < 1 - EPS) groups.push(edgeGroups(start, idx, 'end', 'x'));
  if (dir.includes('w') && r0.x > EPS) groups.push(edgeGroups(start, idx, 'start', 'x'));
  if (dir.includes('s') && r0.y + r0.h < 1 - EPS) groups.push(edgeGroups(start, idx, 'end', 'y'));
  if (dir.includes('n') && r0.y > EPS) groups.push(edgeGroups(start, idx, 'start', 'y'));
  if (!groups.length) return;
  const gb = wall.getBoundingClientRect();
  const usable = { x: gb.width - 9, y: gb.height - 9 };
  const minFrac = { x: 160 / usable.x, y: 90 / usable.y };
  const x0 = e.clientX, y0 = e.clientY;
  handle.classList.add('dragging');
  handle.setPointerCapture(e.pointerId);
  const hasX = groups.some(g => g.p === 'x'), hasY = groups.some(g => g.p === 'y');
  const bothCls = (dir === 'ne' || dir === 'sw') ? 'rz-both-alt' : 'rz-both';
  document.body.classList.add('grid-resizing', hasX && hasY ? bothCls : hasX ? 'rz-col' : 'rz-row');
  let raf = 0, lastX = x0, lastY = y0;
  const onMove = (ev) => {
    lastX = ev.clientX; lastY = ev.clientY;
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = 0;
      const rects = start.map(r => ({ ...r }));
      for (const g of groups) {
        const { p, s, coord } = g;
        const min = minFrac[p];
        const delta = (p === 'x' ? lastX - x0 : lastY - y0) / usable[p];
        let lo = -Infinity, hi = Infinity;
        g.before.forEach(i => { lo = Math.max(lo, start[i][p] + Math.min(min, start[i][s] / 2)); });
        g.after.forEach(i => { hi = Math.min(hi, start[i][p] + start[i][s] - Math.min(min, start[i][s] / 2)); });
        const c = Math.max(lo, Math.min(hi, coord + delta));
        g.before.forEach(i => { rects[i][s] = c - start[i][p]; });
        g.after.forEach(i => { rects[i][s] = start[i][p] + start[i][s] - c; rects[i][p] = c; });
      }

    });
  };
  const onUp = () => {
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    handle.removeEventListener('pointercancel', onUp);
    handle.classList.remove('dragging');
    document.body.classList.remove('grid-resizing', 'rz-both', 'rz-both-alt', 'rz-col', 'rz-row');
    LS.set(layoutKey(tilesArr.length), JSON.stringify(gridShape.rects));
  };
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', onUp);
});
wall.addEventListener('dblclick', (e) => {

// ═══ Roster ═══
const rosterList = $('#roster-list');
let rosterFrame = 0, rosterSig = '', rosterHover = false, rosterOrder = [];
function scheduleRoster() { if (!rosterFrame) rosterFrame = requestAnimationFrame(renderRoster); }
rosterList.addEventListener('mouseenter', () => { rosterHover = true; });
rosterList.addEventListener('mouseleave', () => { rosterHover = false; scheduleRoster(); });

// Waiting first, then working, then recently stopped, then the rest; favorites on top.
function rankOf(st) {
  const s = dispStatus(st);
  if (s === 'permission' || s === 'error') return 0;
  if (s === 'working') return 1;
  if (s === 'recent') return 2;
  return 3;
}
function sortedAgents() {
  const arr = [...agents.values()];
  arr.sort((a, b) => {
    const fa = favs.has(a.pane.target), fb = favs.has(b.pane.target);
    if (fa !== fb) return fa ? -1 : 1;
    const ra = rankOf(a), rb = rankOf(b);
    if (ra !== rb) return ra - rb;
    if (ra >= 2) { const d = stoppedAtOf(b) - stoppedAtOf(a); if (d) return d; }
    return a.num - b.num;
  });
  return arr;
}
function statusHTML(st, s) {
  let text = labelFor(st) || (s === 'idle' && stoppedAtOf(st) ? 'Idle · stopped ' + ago(stoppedAtOf(st)) : WORD[s] || '');
  let bar = '';
  const m = s === 'working' ? text.match(/^(.*?)\s*(\d{1,3})%\s*$/) : null;   // "Compacting… 42%"
  if (m) { text = m[1]; bar = `<span class="pbar"><i style="width:${Math.min(100, +m[2])}%"></i></span><span>${esc(m[2])}%</span>`; }
  return `<span class="txt">${esc(text)}</span>${bar}`;
}
function badgesHTML(st) {
  let h = '';
  if (st.pmSummary && st.pmSummary.total) {
    const s = st.pmSummary;
    h += `<span class="bdg pm" title="${s.completed} done, ${s.inProgress} active, ${s.pending} pending"><b>${s.completed}</b>/${s.total}</span>`;
  }
  if (st.sched) h += `<span class="bdg sch" title="Scheduled: ${esc(st.sched.command)} (every ${esc(st.sched.intervalMin)}m)">⏱ ${esc(st.sched.attempts)}/${esc(st.sched.maxAttempts)}</span>`;
  return h;
}
function rowHTML(st) {
  const p = st.pane, t = p.target, s = dispStatus(st);
  const fav = favs.has(t), onw = isOnWall(t);
  const folder = p.dirName && p.dirName !== p.session ? esc(p.dirName) : '';
  const br = p.branch && p.branch !== '-' ? p.branch : '';
  const l2 = [folder, br ? `<span class="br">${esc(br)}</span>` : ''].filter(Boolean).join(' · ') || esc(t);
  const paneTag = (t.split(':')[1] || '').replace('.', ':');
  const prof = p.agent !== 'codex' && p.profile ? `<span class="prof">${esc(p.profile)}</span>` : '';
  return `<div class="row ${onw ? 'wall' : ''} ${selected === t ? 'sel' : ''}" data-s="${s}" data-t="${esc(t)}" title="${onw ? 'On the wall' : 'Click to show on the wall'}">
    <span class="row-num">${st.num}</span>
    <div class="row-main">
      <div class="row-l1"><span class="agent-mark">${markFor(p.agent)}</span><span class="row-name">${esc(p.session || t)}</span><span class="row-pane">${esc(paneTag)}</span>${prof}${fav ? `<span class="star on" style="display:inline-flex;color:#f5b301">${icon('star', 'ic')}</span>` : ''}</div>
      <div class="row-l2">${l2}</div>
      <div class="row-l3">${statusHTML(st, s)}</div>
    </div>
    <div class="row-side">
      <div class="row-tools">
        <button class="iconbtn star ${fav ? 'on' : ''}" data-act="fav" title="${fav ? 'Remove from favorites' : 'Add to favorites (pinned to the top)'}">${icon('star')}</button>
        <button class="iconbtn" data-act="term" title="Open in terminal">${icon('ext')}</button>
        <button class="iconbtn" data-act="wall" title="${onw ? 'Take off the wall' : 'Put on the wall'}">${icon(onw ? 'win-off' : 'win')}</button>
      </div>
      <div class="badges">${badgesHTML(st)}</div>
    </div>
  </div>`;
}
function renderRoster() {
  rosterFrame = 0;
  // chip counts
  const c = { all: 0, permission: 0, working: 0, recent: 0, idle: 0 };
  for (const st of agents.values()) {
    if (!passesShared(st)) continue;
    c.all++;
    const s = dispStatus(st);
    if (s === 'permission' || s === 'error') c.permission++;
    else if (s === 'working') c.working++;
    else if (s === 'recent') c.recent++;
    else c.idle++;
  }
  for (const k in c) { const el = $('#cc-' + k); if (el && el.textContent !== String(c[k])) el.textContent = c[k]; }
  $$('#chips .chip').forEach(ch => ch.classList.toggle('on', ch.dataset.f === filters.chip));

  let list = sortedAgents().filter(st => passesShared(st) && passesChip(st));
  // While the pointer is over the list, keep the order so a row never moves under the cursor.
  if (rosterHover && rosterOrder.length) {
    const pos = new Map(rosterOrder.map((t, i) => [t, i]));
    list.sort((a, b) => (pos.get(a.pane.target) ?? 1e9) - (pos.get(b.pane.target) ?? 1e9));
  }
  const html = list.map(rowHTML).join('');
  const sig = html + '|' + rosterHover;
  if (sig !== rosterSig) {
    rosterSig = sig;
    const y = rosterList.scrollTop;
    rosterList.innerHTML = html || `<div class="ro-empty">${agents.size ? 'No agent matches these filters.' : 'No agents found. Start a session with New session, or run Claude Code inside tmux.'}</div>`;
    rosterList.scrollTop = y;
  }
  rosterOrder = list.map(st => st.pane.target);
  renderRack();
  updateInboxCount();
}
rosterList.addEventListener('click', (e) => {
  const row = e.target.closest('.row'); if (!row) return;
  const t = row.dataset.t;
  const act = e.target.closest('[data-act]');
  if (act) {
    e.stopPropagation();
    if (act.dataset.act === 'fav') toggleFav(t);
    else if (act.dataset.act === 'term') gotoTerminal(t);
    else if (act.dataset.act === 'wall') setOnWall(t, !isOnWall(t));
    return;
  }
  if (!isOnWall(t)) setOnWall(t, true);
  selectAgent(t, true);
});
function toggleFav(t) {
  if (favs.has(t)) favs.delete(t); else favs.add(t);
  LS.set('cw_favs', JSON.stringify([...favs]));

      const paths = await uploadFiles(files, setBusy);
      setBusy(false);
      if (paths.length) sendInput(paths.join(' ') + ' ');
      return;
    }
    const text = e.clipboardData.getData('text');
    if (text) sendInput(text);
  });

  // ── Approval bar (inside a waiting tile) ──
  st.setApproval = (p) => {
    const key = p ? JSON.stringify(p) : '';
    if (key === st.approvalKey) return;
    st.approvalKey = key;
    if (!p) { askBar.hidden = true; askBar.innerHTML = ''; updateGridLayout(); return; }
    askBar.innerHTML = approvalHTML(p, { compact: true });
    bindApproval(askBar, p);
    askBar.hidden = false;
  };

  Object.assign(st, {
    connect, sendInput, sendHistoryMode,
    destroy: () => {
      closed = true;
      renderQueue.delete(liveRenderer);
      clearTimeout(reconnectTimer);
      if (ws) { ws.onclose = null; ws.close(); }
      tile.classList.add('removing');
      setTimeout(() => tile.remove(), 300);
    },
  });
  connect();
  return st;
}

// ── Uploads (shared by attach, paste and drop): hash lookup first, images downscaled ──
async function sha256Hex(file) {
  try {
    const h = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
    return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (_) { return ''; }
}
function xhrUpload(file, hash, onProgress) {
  return new Promise((resolve) => {
    try {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded, e.total); };
      xhr.onload = () => { try { const j = JSON.parse(xhr.responseText); resolve(j && j.path ? j.path : ''); } catch (_) { resolve(''); } };
      xhr.onerror = () => resolve('');
      const ext = (file.type && file.type.includes('/')) ? '.' + file.type.split('/')[1] : '';
      const fd = new FormData();
      if (hash) fd.append('hash', hash);
      fd.append('file', file, file.name || ('paste-' + Date.now() + ext));
      xhr.send(fd);
    } catch (_) { resolve(''); }
  });
}
async function maybeCompress(file) {
  if (!file.type || !file.type.startsWith('image/') || file.type === 'image/gif' || file.size < 400 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const blob = await new Promise(res => canvas.toBlob(res, 'image/webp', 0.9));
    if (blob && blob.size < file.size) return new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.webp', { type: 'image/webp' });
  } catch (_) {}
  return file;
}
async function uploadFiles(files, onState) {
  const results = new Array(files.length).fill('');
  const jobs = [];
  for (let i = 0; i < files.length; i++) {
    const hash = await sha256Hex(files[i]);
    if (hash) {
      try { const j = await (await fetch('/api/upload/lookup?hash=' + hash)).json(); if (j && j.path) { results[i] = j.path; continue; } } catch (_) {}
    }
    jobs.push({ idx: i, file: await maybeCompress(files[i]), hash });
  }
  const total = jobs.reduce((s, j) => s + (j.file.size || 0), 0);
  let done = 0;
  for (const j of jobs) {
    results[j.idx] = await xhrUpload(j.file, j.hash, (loaded) => { if (total > 0 && onState) onState(Math.min(99, Math.round((done + loaded) / total * 100))); });
    done += j.file.size || 0;
  }
  return results.filter(Boolean);
}

function bindApproval(root, p) {
  const st = () => agents.get(p.target);
  const done = () => { fetch(`/api/approvals/clear/${p.target}`).catch(() => {}); setTimeout(refreshApprovals, 500); };
  const send = (input) => { const s = st(); if (s) s.sendInput(input); done(); root.closest('.card')?.remove(); };
  root.querySelector('[data-yes]')?.addEventListener('click', (e) => { e.stopPropagation(); send('1'); });
  root.querySelector('[data-always]')?.addEventListener('click', (e) => { e.stopPropagation(); send('2'); });
  root.querySelector('[data-deny]')?.addEventListener('click', (e) => { e.stopPropagation(); send('\x1b'); });
  root.querySelector('[data-focus]')?.addEventListener('click', (e) => { e.stopPropagation(); setOnWall(p.target, true); selectAgent(p.target, true); });
  // AskUserQuestion: picking an option is the approval — send its number.
  root.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); send(b.dataset.opt); }));
  const other = root.querySelector('[data-other]'), input = root.querySelector('.other-input');
  if (other && input) {
    other.addEventListener('click', (e) => { e.stopPropagation(); input.hidden = !input.hidden; if (!input.hidden) input.focus(); });
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('keydown', (e) => {
      e.stopPropagation();
      if (e.key !== 'Enter' || !input.value.trim()) return;
      let n = 1;
      try { n = (typeof p.toolInput === 'string' ? JSON.parse(p.toolInput) : p.toolInput).questions[0].options.length; } catch (_) {}
      const s = st(), text = input.value.trim();
      if (s) {   // approve, pick "Other" (last option + 1), then type the text
        s.sendInput('1');
        setTimeout(() => s.sendInput(String(n + 1)), 1500);
        setTimeout(() => postJSON(`/api/send/${p.target}`, { text }).catch(() => {}), 2500);
      }
      done(); root.closest('.card')?.remove();
    });
  }
}

// ── Schedules (/api/scheduler) ──
function updateTaskTargets() {
  const sel = $('#task-target'); if (!sel) return;
  const cur = sel.value;
  const html = '<option value="">Choose an agent</option>' + [...agents.values()].map(s =>
    `<option value="${esc(s.pane.target)}">${s.num} · ${esc(s.pane.session)} · ${esc(s.pane.dirName)}</option>`).join('');

async function refreshTasks() {
  let tasks = [];

  const active = tasks.filter(t => t.status === 'running' || t.status === 'paused');

let projects = null;
async function openLaunch() {
  let agent = LS.get('cw2-launch-agent') || 'claude', launching = false, hl = 0;
  const d = openDialog({ title: 'New session', html: `
    <div class="seg" role="radiogroup">
      <button data-a="claude">Claude</button><button data-a="claude-work">Claude · work</button><button data-a="codex">Codex</button>
    </div>
    <label class="field" style="margin-bottom:10px">${icon('search')}<input placeholder="Search projects" autocomplete="off" spellcheck="false"></label>
    <div class="list" style="max-height:46vh;overflow-y:auto"><div class="empty">Loading…</div></div>`,
    foot: '<span style="flex:1;font:500 12.5px var(--cond);color:var(--dim);align-self:center">↑↓ choose · Enter starts · the new agent appears on the wall</span><button class="btn" data-close>Cancel</button>' });
  const seg = $('.seg', d.el), input = $('input', d.el), list = $('.list', d.el);
  const syncSeg = () => $$('button', seg).forEach(b => b.classList.toggle('on', b.dataset.a === agent));
  syncSeg();
  seg.addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; agent = b.dataset.a; LS.set('cw2-launch-agent', agent); syncSeg(); input.focus(); });
  const rows = () => {
    const q = input.value.trim().toLowerCase();
    return (projects || []).filter(p => !q || p.name.toLowerCase().includes(q));
  };
  const render = () => {
    const r = rows();
    hl = Math.min(hl, Math.max(0, r.length - 1));
    list.innerHTML = r.length ? r.map((p, i) => `<div class="li ${i === hl ? 'hl' : ''}" data-path="${esc(p.path)}">${icon('folder')}<span class="nm">${esc(p.name)}</span><span class="sm">Start</span></div>`).join('')
      : `<div class="empty">${projects && projects.length ? 'No project matches.' : 'No git projects found.'}</div>`;
  };
  const start = async (row) => {
    if (!row || launching) return;
    launching = true; $('.sm', row).textContent = 'Starting…';
    try {
      const r = await postJSON('/api/launch', { path: row.dataset.path, agent });
      if (!r.ok) throw new Error();
      d.close(); toast('Session started. It appears on the wall in a moment.');
      const before = new Set(agents.keys());
      for (const ms of [1200, 3000, 6000]) setTimeout(async () => {
        await refreshPaneList();
        for (const t of agents.keys()) if (!before.has(t)) { setOnWall(t, true); selectAgent(t, true); before.add(t); }
      }, ms);
    } catch (_) { $('.sm', row).textContent = 'Failed'; }
    launching = false;
  };
  input.addEventListener('input', () => { hl = 0; render(); });
  input.addEventListener('keydown', (e) => {
    const n = rows().length;
    if (e.key === 'ArrowDown') { e.preventDefault(); hl = Math.min(hl + 1, n - 1); render(); list.querySelector('.hl')?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'ArrowUp') { e.preventDefault(); hl = Math.max(hl - 1, 0); render(); list.querySelector('.hl')?.scrollIntoView({ block: 'nearest' }); }
    if (e.key === 'Enter') { e.preventDefault(); start(list.querySelector('.li.hl')); }
  });
  list.addEventListener('click', (e) => start(e.target.closest('.li')));
  input.focus();
  if (!projects) { try { projects = await (await fetch('/api/projects')).json() || []; } catch (_) { projects = []; } }
  render();
}

// ── Usage limits (/api/limits) ──
const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); };
const fmtWeek = (iso) => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString([], { weekday: 'short', hour: 'numeric' }); };
function usageWin(label, w, kind) {
  if (!w) return '';
  const u = Math.round(w.utilization || 0);
  const cls = u >= 90 ? 'hi' : u >= 60 ? 'mid' : '';
  const reset = w.resets_at ? 'Resets ' + (kind === 'week' ? fmtWeek(w.resets_at) : fmtTime(w.resets_at)) : '';
  return `<div class="uw-row"><div class="uw-top"><span>${label}</span><b>${u}%</b></div><div class="ubar"><i class="${cls}" style="width:${Math.min(u, 100)}%"></i></div><div class="uw-reset">${esc(reset)}</div></div>`;
}
let usageData = null;
async function loadUsage(force) {
  try { usageData = await (await fetch('/api/limits' + (force ? '?force=1' : ''))).json(); } catch (_) { usageData = null; }
  const mini = $('#usage-mini');
  if (usageData) {
    const vals = Object.values(usageData).filter(Boolean).map(a => Math.round((a.five_hour || {}).utilization || 0));
    const top = vals.length ? Math.max(...vals) : null;
    mini.textContent = top == null ? '' : top + '%';
    mini.style.color = top >= 90 ? 'var(--ask)' : top >= 60 ? 'var(--rest)' : 'var(--muted)';
    mini.title = '5-hour window, highest account';
  }
  return usageData;
}
async function openUsage() {
  const d = openDialog({ title: 'Usage limits', html: '<div class="busy-line"><span class="spin"></span>Loading…</div>',
    foot: `<button class="btn" data-refresh>${icon('reload')}Refresh</button><button class="btn" data-close>Close</button>` });
  const render = (u) => {
    if (!u) { d.body.innerHTML = '<p class="note err">Could not load usage.</p>'; return; }
    const names = { personal: 'Personal', work: 'Work' };
    const html = Object.entries(u).filter(([, a]) => a).map(([k, a]) =>
      `<div class="uw"><div class="uw-h">${esc(names[k] || k)}</div>${usageWin('5-hour window', a.five_hour, '5h')}${usageWin('Weekly', a.seven_day, 'week')}</div>`).join('');
    d.body.innerHTML = html || '<p class="note">No usage data.</p>';
  };
  render(await loadUsage(false));
  $('[data-refresh]', d.el).addEventListener('click', async (e) => {
    const b = e.currentTarget; b.disabled = true; d.body.innerHTML = '<div class="busy-line"><span class="spin"></span>Refreshing…</div>';
    render(await loadUsage(true)); b.disabled = false;
  });
}

    for (const f of files) { const fd = new FormData(); fd.append('file', f, f.name); await fetch('/api/drive/upload?path=' + enc(path), { method: 'POST', body: fd }).catch(() => {}); }
    load(path);
  };
  file.addEventListener('change', () => { if (file.files.length) uploadAll([...file.files]); file.value = ''; });
  d.box.addEventListener('dragover', (e) => e.preventDefault());
  d.box.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) uploadAll([...e.dataTransfer.files]); });
  load('');
}

// ── Camera (/api/camera*) ──
function openCamera() {
  const NOTE = 'The camera light on the Mac turns on for about two seconds.';
  let photos = [], clearArmed = false;
  const d = openDialog({ title: 'Camera', wide: true, html: `
    <div class="acts" style="margin-bottom:8px"><button class="btn primary" data-snap>${icon('camera')}Take a picture</button><button class="btn danger" data-clear hidden>Delete all pictures</button></div>
    <p class="note">${NOTE}</p><div class="cam-grid"></div>` });
  const grid = $('.cam-grid', d.el), note = $('p.note', d.el), snap = $('[data-snap]', d.el), clear = $('[data-clear]', d.el);
  const src = (name, thumb) => '/api/camera/photo?name=' + enc(name) + (thumb ? '&thumb=1' : '');
  const day = (t) => { const x = new Date(t * 1000), y = new Date(); y.setDate(y.getDate() - 1);
    if (x.toDateString() === new Date().toDateString()) return 'Today'; if (x.toDateString() === y.toDateString()) return 'Yesterday';
    return x.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }); };
  const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  async function load() {
    try { photos = (await (await fetch('/api/camera', { cache: 'no-store' })).json()).photos || []; } catch (_) { photos = []; }
    clear.hidden = !photos.length;
    if (!photos.length) { grid.innerHTML = '<p class="note" style="grid-column:1/-1">No pictures yet.</p>'; return; }
    let html = '', cur = '';
    photos.forEach((p, i) => { const dd = day(p.time); if (dd !== cur) { cur = dd; html += `<div class="cam-day">${esc(dd)}</div>`; }
      html += `<button class="cam-th" data-i="${i}"><img loading="lazy" src="${esc(src(p.name, true))}" alt="Picture at ${clock(p.time)}"><span>${clock(p.time)}</span></button>`; });
    grid.innerHTML = html;
  }
  function view(i) {
    let idx = i, armed = false;
    const v = document.createElement('div'); v.className = 'cam-view';
    v.innerHTML = `<img alt=""><div class="cam-bar"><span></span><button class="btn" data-o>${icon('left')}Older</button><button class="btn" data-n>Newer${icon('right')}</button>
      <button class="btn danger" data-del>${icon('trash')}Delete</button><button class="btn" data-x>Close</button></div>`;
    document.body.appendChild(v);
    const img = $('img', v), lab = $('span', v), del = $('[data-del]', v);
    const vd = { el: v, close() { v.remove(); const k = dlgStack.indexOf(vd); if (k >= 0) dlgStack.splice(k, 1); } };
    dlgStack.push(vd);
    const show = () => { const p = photos[idx]; if (!p) { vd.close(); return; } img.src = src(p.name); lab.textContent = day(p.time) + ', ' + clock(p.time);
      $('[data-o]', v).disabled = idx >= photos.length - 1; $('[data-n]', v).disabled = idx <= 0; armed = false; del.textContent = 'Delete'; };
    $('[data-o]', v).onclick = () => { idx++; show(); };
    $('[data-n]', v).onclick = () => { idx--; show(); };
    $('[data-x]', v).onclick = () => vd.close();
    del.onclick = async () => {
      if (!armed) { armed = true; del.textContent = 'Click again to delete'; return; }
      await fetch('/api/camera/delete?name=' + enc(photos[idx].name), { method: 'POST' }).catch(() => {});
      await load(); idx = Math.min(idx, photos.length - 1); show();
    };
    show();
  }
  grid.addEventListener('click', (e) => { const b = e.target.closest('.cam-th'); if (b) view(+b.dataset.i); });
  snap.addEventListener('click', async () => {
    snap.disabled = true; snap.innerHTML = '<span class="spin"></span>Taking a picture…'; note.className = 'note'; note.textContent = NOTE;
    try { const r = await fetch('/api/camera/snap', { method: 'POST' }); if (!r.ok) throw new Error((await r.text()).trim() || 'HTTP ' + r.status); await load(); view(0); }
    catch (e) { note.className = 'note err'; note.textContent = 'Could not take a picture: ' + e.message; }
    snap.disabled = false; snap.innerHTML = icon('camera') + 'Take a picture';
  });
  clear.addEventListener('click', async () => {
    if (!clearArmed) { clearArmed = true; clear.textContent = `Click again to delete all ${photos.length}`; setTimeout(() => { clearArmed = false; clear.textContent = 'Delete all pictures'; }, 3000); return; }
    await fetch('/api/camera/delete?all=1', { method: 'POST' }).catch(() => {}); clearArmed = false; clear.textContent = 'Delete all pictures'; load();
  });
  load();
}

  function render() {

// ═══ Keyboard ═══
function isFormField(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable); }
const selTile = () => { const st = agents.get(selected); return st && st.tile.parentElement === wall ? st : null; };

// Capture phase: these work even while typing in a tile.
document.addEventListener('keydown', (e) => {
  // Esc: close the top menu, dialog or drawer first.
  if (e.key === 'Escape' && !e.shiftKey) {
    if (menuEl) { e.preventDefault(); e.stopPropagation(); closeMenu(); return; }
    if (dlgStack.length) { e.preventDefault(); e.stopPropagation(); dlgStack[dlgStack.length - 1].close(); return; }
    if ($('#mm').classList.contains('open') && $('#mm').contains(document.activeElement)) { e.preventDefault(); mmToggle(false); return; }
  }
  const mod = e.metaKey || e.ctrlKey;
  if (mod && !e.altKey && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); e.stopPropagation(); openPalette(); return; }
  if (mod && !e.altKey && (e.key === 'm' || e.key === 'M')) { e.preventDefault(); e.stopPropagation(); mmToggle(); return; }
  if (e.ctrlKey && !e.metaKey && !e.altKey && e.key === '/') { e.preventDefault(); e.stopPropagation(); openKeys(); return; }
  if (e.ctrlKey && !e.metaKey && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault(); e.stopPropagation();
    if (document.body.classList.contains('no-roster')) toggleRoster();
    searchInput.focus(); searchInput.select(); return;
  }
  if (dlgStack.length) return;                       // dialogs keep their own keys
  if (e.ctrlKey && !e.metaKey && !e.altKey && e.key >= '1' && e.key <= '9') { e.preventDefault(); e.stopPropagation(); focusAgentByNumber(+e.key, true); return; }
  if (e.ctrlKey && e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); moveFocus(e.shiftKey ? -1 : 1, true); return; }
  if (isFormField(e.target)) return;                 // ⌥← is word-jump in fields
  if (e.altKey && !e.ctrlKey && !e.metaKey) {
    switch (e.key) {
      case 'ArrowLeft': e.preventDefault(); e.stopPropagation(); moveFocus(-1); return;
      case 'ArrowRight': e.preventDefault(); e.stopPropagation(); moveFocus(1); return;
      case 'ArrowUp': e.preventDefault(); e.stopPropagation(); moveFocus(-gridColCount()); return;
      case 'ArrowDown': e.preventDefault(); e.stopPropagation(); moveFocus(gridColCount()); return;
    }
    // e.code: on macOS ⌥+letter types a special character in e.key
    if (e.code === 'KeyZ') { e.preventDefault(); e.stopPropagation(); const st = agents.get(selected); if (st) toggleZoom(st); return; }
    if (e.code === 'KeyM') { e.preventDefault(); e.stopPropagation(); if (selected) setOnWall(selected, !isOnWall(selected), { focus: !isOnWall(selected) }); return; }
  }
  if (e.ctrlKey && !e.metaKey && !e.altKey && e.code === 'Backquote') { e.preventDefault(); e.stopPropagation(); if (selected) gotoTerminal(selected); return; }
  if (e.shiftKey && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); return; }

  // Plain keys: only when not typing in a tile.
  if (e.target.closest && (e.target.closest('.tile-body') || e.target.closest('#mm'))) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '?') { e.preventDefault(); openKeys(); return; }
  if (e.key >= '1' && e.key <= '9') { e.preventDefault(); focusAgentByNumber(+e.key, false); return; }
  switch (e.key) {
    case 'h': e.preventDefault(); moveFocus(-1, false); return;
    case 'l': e.preventDefault(); moveFocus(1, false); return;
    case 'k': e.preventDefault(); moveFocus(-gridColCount(), false); return;
    case 'j': e.preventDefault(); moveFocus(gridColCount(), false); return;
    case 't': e.preventDefault(); if (selected) gotoTerminal(selected); return;
    case 'p': e.preventDefault(); if (selected) setOnWall(selected, !isOnWall(selected)); return;
    case 'n': e.preventDefault(); openLaunch(); return;
    case '[': e.preventDefault(); toggleRoster(); return;
    case ']': e.preventDefault(); setInboxOpen(!inboxOpen()); return;
    case 'Enter': if (selected) { e.preventDefault(); selectAgent(selected, true); } return;
  }
}, true);

const uiEvents = new EventSource('/api/ui/events');
uiEvents.onmessage = (e) => {
  try {
    const cmd = JSON.parse(e.data);
    if (cmd.action === 'ping') return;
    const st = agents.get(cmd.target);
    switch (cmd.action) {
      case 'focus': if (st) { setOnWall(cmd.target, true); selectAgent(cmd.target, true); } break;
      case 'zoom': if (st) toggleZoom(st); break;
      case 'minimize': if (st) setOnWall(cmd.target, false); break;
      case 'restore': if (st) setOnWall(cmd.target, true); break;
      case 'scroll-bottom': if (st) st.jumpBottom(); break;
    }
  } catch (err) {}
};

function mmAdd(type, text) {
  const el = document.createElement('div');
  el.className = `mm-msg ${type}`; el.textContent = text;
  mmMsgs.appendChild(el); mmMsgs.scrollTop = mmMsgs.scrollHeight;
  return el;
}
// Replies can quote agent output: sanitize the rendered markdown; offline, show escaped text.
function mmRender(text) { return window.DOMPurify && window.marked ? DOMPurify.sanitize(marked.parse(text)) : esc(text).replace(/\n/g, '<br>'); }
function mmConnect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  mmWs = new WebSocket(`${proto}//${location.host}/ws/mastermind`);
  mmWs.onopen = () => mmAdd('status', 'Connected');
  mmWs.onclose = () => { mmWs = null; mmAdd('status', 'Disconnected. Open Mastermind again to reconnect.'); mmSend.disabled = false; };
  mmWs.onerror = () => mmWs && mmWs.close();
  mmWs.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    switch (msg.type) {
      case 'status': mmAdd('status', msg.data === 'thinking' ? 'Thinking…' : msg.data); mmSend.disabled = true; break;
      case 'stream':
        if (!mmCur) { mmCur = mmAdd('assistant', ''); mmText = ''; }
        mmText += msg.data; mmCur.innerHTML = mmRender(mmText); mmMsgs.scrollTop = mmMsgs.scrollHeight; break;
      case 'tool': mmAdd('tool', msg.data); break;
      case 'done':
        if (mmCur && mmText) mmCur.innerHTML = mmRender(mmText);
        mmCur = null; mmText = ''; mmSend.disabled = false;
        if (msg.data && msg.data !== '0.0000') mmAdd('status', `Cost: $${msg.data}`);
        break;
      case 'error': mmAdd('error', msg.data); mmSend.disabled = false; mmCur = null; break;
    }
  };
}
function mmSendMessage() {
  const text = mmInput.value.trim();
  if (!text) return;
  if (!mmWs || mmWs.readyState !== WebSocket.OPEN) { mmConnect(); toast('Connecting to Mastermind… send again in a moment'); return; }
  mmAdd('user', text);
  mmWs.send(JSON.stringify({ text, model: $('#mm-model').value }));
  mmInput.value = ''; mmInput.style.height = ''; mmSend.disabled = true; mmCur = null;
}
mmSend.addEventListener('click', mmSendMessage);
mmInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); mmSendMessage(); } });
mmInput.addEventListener('input', () => { mmInput.style.height = 'auto'; mmInput.style.height = Math.min(140, mmInput.scrollHeight) + 'px'; });
$('#mm-model').value = LS.get('cw2-mm-model') || 'haiku';
$('#mm-model').addEventListener('change', (e) => LS.set('cw2-mm-model', e.target.value));

// ═══ Meters (/ws/system, GPU from /api/sysstats) ═══
(function meters() {
  const wrap = $('#meters');
  const els = { cpu: $('#m-cpu'), mem: $('#m-mem'), disk: $('#m-disk'), gpu: $('#m-gpu'), net: $('#m-net') };
  const fmtBytes = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(0) + ' MB' : (b / 1024).toFixed(0) + ' KB';
  const fmtRate = (bps) => bps >= 1e6 ? (bps / 1e6).toFixed(1) + 'M' : bps >= 1e3 ? (bps / 1e3).toFixed(0) + 'K' : Math.round(bps) + 'B';
  const setPct = (el, pct, tip) => {
    pct = Math.max(0, Math.min(100, pct || 0));
    el.classList.toggle('warn', pct >= 70 && pct < 90); el.classList.toggle('crit', pct >= 90);
    $('b', el).textContent = Math.round(pct) + '%';
    const bar = $('.bar i', el); if (bar) bar.style.width = pct + '%';
    if (tip) el.title = tip;
  };
  let ws = null, delay = 800, wsGpu = false;
  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws/system`);
    ws.onopen = () => { delay = 800; wrap.classList.remove('offline'); };
    ws.onmessage = (e) => {
      let m; try { m = JSON.parse(e.data); } catch { return; }
      setPct(els.cpu, m.cpu, `CPU ${Math.round(m.cpu)}% · ${m.ncpu} cores`);
      setPct(els.mem, m.mem, `RAM ${fmtBytes(m.memUsed)} of ${fmtBytes(m.memTotal)}`);
      setPct(els.disk, m.disk, `Disk ${fmtBytes(m.diskUsed)} of ${fmtBytes(m.diskTotal)}`);
      if (typeof m.gpu === 'number' && m.gpu >= 0) { wsGpu = true; els.gpu.hidden = false; setPct(els.gpu, m.gpu, `GPU ${Math.round(m.gpu)}%`); }
      $('b', els.net).textContent = `↓${fmtRate(m.netDown)} ↑${fmtRate(m.netUp)}`;
      els.net.title = `Network ↓${fmtRate(m.netDown)}/s ↑${fmtRate(m.netUp)}/s`;
    };
    ws.onclose = () => { wrap.classList.add('offline'); setTimeout(connect, delay); delay = Math.min(delay * 1.5, 10000); };
    ws.onerror = () => ws.close();
  }
  connect();
  pollVisible(async () => {
    if (wsGpu) return;
    try {
      const s = await (await fetch('/api/sysstats')).json();
      if (s.gpu == null || s.gpu < 0) { els.gpu.hidden = true; return; }
      els.gpu.hidden = false; setPct(els.gpu, s.gpu, `GPU ${s.gpu}%`);
    } catch (_) {}
  }, 5000);
})();

// ═══ Summary (/api/summary): recent status, stop time and activity for every agent ═══
async function refreshSummary() {
  try {
    const d = await (await fetch('/api/summary')).json();
    const seen = new Set();
    let changed = false;
    for (const p of d.panes || []) {
      seen.add(p.target);
      const prev = summary.get(p.target);
      const next = { status: p.status || 'idle', stoppedAt: p.stoppedAt || 0, activity: p.activity || '' };
      if (!prev || prev.status !== next.status || prev.stoppedAt !== next.stoppedAt || prev.activity !== next.activity) { summary.set(p.target, next); changed = true; }
    }
    for (const t of [...summary.keys()]) if (!seen.has(t)) { summary.delete(t); changed = true; }
    if (changed) for (const [, st] of agents) st.refresh();
    try { const n = (d.pending || 0); n > 0 ? navigator.setAppBadge?.(n) : navigator.clearAppBadge?.(); } catch (_) {}
  } catch (e) {}
}

// ═══ Front-end version: reload once when the server ships a new page ═══
(async () => {
  try {
    const { version } = await (await fetch('/api/version', { cache: 'no-store' })).json();
    const prev = LS.get('cw2_ver');
    if (prev && prev !== version && !sessionStorage.getItem('cw2_reloaded')) {
      sessionStorage.setItem('cw2_reloaded', '1'); LS.set('cw2_ver', version); location.reload(); return;
    }
    LS.set('cw2_ver', version);
    if (prev === version) sessionStorage.removeItem('cw2_reloaded');
  } catch (_) {}
})();

// ═══ Start ═══
async function init() {
  if (LS.get('cw2-roster') === '0') document.body.classList.add('no-roster');
  $('#roster-btn').classList.toggle('on', rosterShown());
  setInboxTab(inboxTab);
  setInboxOpen(LS.get('cw2-inbox') === '1');
  await refreshSummary();                       // first-sight wall choice needs the statuses
  let panes = [];
  try { panes = await (await fetch('/api/panes')).json() || []; } catch (e) {}
  const order = LS.json('cw2-order', []);
  const pos = new Map(order.map((t, i) => [t, i]));
  const small = panes.length <= 4;          // a small fleet: everything fits on the wall
  for (const pane of panes) addAgent(pane, small);
  // wall order from the last session
  $$('.tile', wall).sort((a, b) => (pos.get(a.dataset.t) ?? 1e9) - (pos.get(b.dataset.t) ?? 1e9)).forEach(el => wall.appendChild(el));
  updateWall();
  if (window.Sortable) Sortable.create(wall, {
    animation: 180, handle: '.t-head', filter: '.t-btns, .iconbtn', preventOnFilter: false, draggable: '.tile', ghostClass: 'tile-ghost',
    onChange: () => updateGridLayout(),
    onEnd: () => { saveOrder(); updateGridLayout(); },
  });
  scheduleRoster();
  refreshApprovals(); refreshPM(); refreshTasks(); loadUsage(false);
  pollVisible(refreshPaneList, 5000);
  pollVisible(refreshSummary, 4000);
  pollVisible(refreshApprovals, 2000);
  pollVisible(refreshPM, 5000);
  pollVisible(refreshTasks, 5000);
  setInterval(() => { if (!document.hidden) loadUsage(false); }, 15 * 60 * 1000);
  setInterval(() => { for (const [, st] of agents) { const s = dispStatus(st); if (s === 'recent' || s === 'idle') st.refresh(); } }, 30000);   // "12m ago" labels; recent ends after 30 min
}
init();
</script>
