<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ports · Claude Wall</title>
<style>
  :root { --bg:#0d0f14; --card:#161922; --card2:#1c2029; --line:#262b36; --fg:#f0f2f6;
    --muted:#9aa0b0; --dim:#5b6172; --accent:#6ea1f7; --ok:#57d977; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  .top { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line);
    position:sticky; top:env(safe-area-inset-top); background:var(--bg); z-index:2; }
  .back { background:var(--card2); border:1px solid var(--line); color:var(--fg); border-radius:9px;
    width:38px; height:38px; font-size:18px; flex:0 0 auto; }
  h1 { font-size:16px; margin:0; flex:1; }
  .refresh { background:var(--card2); border:1px solid var(--line); color:var(--muted); border-radius:9px;
    width:38px; height:38px; font-size:16px; flex:0 0 auto; }
  .manual { display:flex; gap:8px; padding:12px 14px 4px; }
  .manual input { flex:1; background:var(--card); border:1px solid var(--line); color:var(--fg);
    border-radius:10px; padding:11px 12px; font-size:15px; -webkit-appearance:none; }
  .manual button { background:var(--accent); border:0; color:#0d1017; font-weight:700; border-radius:10px;
    padding:0 16px; font-size:14px; }
  #list { display:flex; flex-direction:column; gap:8px; padding:10px 14px 28px; }
  .row { display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:12px;
    background:var(--card); border:1px solid var(--line); }
  .port { font-family:"SFMono-Regular",Menlo,monospace; font-size:16px; font-weight:700; flex:0 0 auto;
    min-width:58px; }
  .proc { flex:1; min-width:0; color:var(--fg); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pdim { color:var(--dim); font-weight:400; font-size:12px; }
  .tag { flex:0 0 auto; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    padding:2px 6px; border-radius:5px; background:rgba(87,217,119,.15); color:var(--ok); }
  .copy, .open { flex:0 0 auto; width:40px; height:36px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:9px; border:1px solid var(--line); background:var(--card2); color:var(--muted);
    font-size:15px; text-decoration:none; }
  .copy:active, .open:active { background:var(--line); }
  .copy.done { color:var(--ok); border-color:var(--ok); }
  .open { color:var(--accent); font-size:18px; }
  .empty { color:var(--muted); text-align:center; padding:44px 20px; }
</style>
</head>
<body>
  <div class="top">
    <button class="back" onclick="location.href='/m.html'" aria-label="Back">‹</button>
    <h1>Local ports</h1>
    <button class="refresh" id="refresh" aria-label="Refresh">⟳</button>
  </div>
  <div class="manual">
    <input id="portInput" type="number" inputmode="numeric" placeholder="Open a port…" min="1" max="65535">
    <button id="go">Open</button>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
<script>
  const listEl = document.getElementById('list');
  const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const urlFor = (port) => location.origin + '/proxy/' + port + '/';
  const openExternal = (port) => window.open(urlFor(port), '_blank', 'noopener'); // breaks out of the PWA into the browser

  async function load() {
    try {
      const ports = await (await fetch('/api/ports', { cache: 'no-store' })).json();
      if (!ports.length) { listEl.innerHTML = '<div class="empty">No local listeners found.</div>'; return; }
      listEl.innerHTML = ports.map((p) => `
        <div class="row">
          <span class="port">:${p.port}</span>
          <span class="proc">${esc(p.name)}${(p.proc && p.proc !== p.name) ? ' <span class="pdim">' + esc(p.proc) + '</span>' : ''}</span>
          ${p.all ? '<span class="tag">all</span>' : ''}
          <button class="copy" data-port="${p.port}" title="Copy URL" aria-label="Copy URL">⧉</button>
          <a class="open" href="${urlFor(p.port)}" target="_blank" rel="noopener" title="Open" aria-label="Open">↗</a>
        </div>`).join('');
    } catch (e) {
      listEl.innerHTML = '<div class="empty">Can\'t reach server.</div>';
    }
  }

  // copy URL (delegated); the open link is a normal target=_blank anchor
  listEl.addEventListener('click', async (e) => {
    const b = e.target.closest('.copy'); if (!b) return;
    try { await navigator.clipboard.writeText(urlFor(b.dataset.port)); } catch (_) {}
    const t = b.textContent; b.textContent = '✓'; b.classList.add('done');
    setTimeout(() => { b.textContent = t; b.classList.remove('done'); }, 1200);
  });

  document.getElementById('refresh').onclick = load;
  document.getElementById('go').onclick = () => {
    const v = parseInt(document.getElementById('portInput').value, 10);
    if (v >= 1 && v <= 65535) openExternal(v);
  };
  document.getElementById('portInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('go').click(); });
  load();
</script>
</body>
</html>
