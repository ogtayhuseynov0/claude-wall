<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claude Wall</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Wall">
<style>
  :root {
    --bg:#0d0f14; --card:#161922; --card2:#1c2029; --line:#262b36;
    --fg:#f0f2f6; --muted:#8b91a3; --dim:#5b6172;
    --work:#f5a742; --perm:#e5566a; --stale:#e8b93b; --idle:#57d977; --codex:#8b7cf0;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; }
  body { padding:0 0 env(safe-area-inset-bottom); max-width:680px; margin:0 auto; }

  header { position:sticky; top:0; z-index:5; background:rgba(13,15,20,0.92);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:10px; }
  .logo { width:28px; height:28px; border-radius:8px; flex:0 0 auto; display:block; }
  h1 { font-size:16px; font-weight:700; margin:0; letter-spacing:-.2px; }
  .counts { margin-left:auto; display:flex; gap:11px; font-size:13px; font-weight:700;
    font-variant-numeric:tabular-nums; align-items:center; }
  .counts .c { display:inline-flex; align-items:center; gap:4px; }
  .counts svg { width:15px; height:15px; }
  .cwork { color:var(--work); } .cperm { color:var(--perm); } .cstale { color:var(--stale); }
  #refresh { margin-left:2px; background:none; border:0; color:var(--muted); padding:6px; cursor:pointer;
    display:inline-flex; border-radius:8px; }
  #refresh:active { background:var(--card); }
  #refresh svg { width:19px; height:19px; }
  #refresh.spin svg { animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .ic { stroke:currentColor; stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; fill:none; }

  .search { display:flex; align-items:center; gap:8px; margin-top:9px; padding:0 12px;
    background:var(--card); border:1px solid var(--line); border-radius:11px; height:40px; }
  .search svg { width:17px; height:17px; color:var(--muted); flex:0 0 auto; }
  .search input { flex:1; min-width:0; background:none; border:0; outline:none; color:var(--fg);
    font-size:15px; font-family:inherit; height:100%; }
  .search input::placeholder { color:var(--dim); }
  .search input::-webkit-search-cancel-button { display:none; }
  #clear { background:none; border:0; color:var(--muted); display:inline-flex; padding:4px; cursor:pointer; }

  .chips { display:flex; gap:7px; margin-top:9px; overflow-x:auto; padding-bottom:2px; }
  .chip { flex:0 0 auto; padding:5px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--muted); font-size:12.5px; font-weight:600; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }

  #list { padding:8px 10px 24px; display:flex; flex-direction:column; gap:8px; }
  .row { display:flex; align-items:center; gap:11px; padding:12px 13px; border-radius:13px;
    background:var(--card); border:1px solid var(--line); text-decoration:none; color:inherit; }
  .row:active { background:var(--card2); }
  .dot { width:11px; height:11px; border-radius:50%; flex:0 0 auto; background:var(--dim); }
  .dot.working { background:var(--work); box-shadow:0 0 8px var(--work); animation:pulse 1.4s ease-in-out infinite; }
  .dot.permission { background:var(--perm); box-shadow:0 0 8px var(--perm); }
  .dot.stale { background:var(--stale); } .dot.idle { background:var(--idle); }
  .dot.error { background:var(--perm); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .meta { min-width:0; flex:1; }
  .nameline { display:flex; align-items:center; gap:7px; min-width:0; }
  .name { font-size:15px; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pane { flex:0 0 auto; font-family:"SFMono-Regular",Menlo,monospace; font-size:11px; font-weight:600;
    color:var(--muted); background:var(--card2); border:1px solid var(--line); border-radius:5px; padding:1px 5px; }
  .sub { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .tag { display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.4px; padding:3px 7px; border-radius:6px; background:var(--card2); color:var(--dim); flex:0 0 auto; }
  .tag svg { width:12px; height:12px; }
  .tag.codex { color:var(--codex); }
  .sub svg { width:11px; height:11px; vertical-align:-1px; margin-right:2px; opacity:.7; }
  .chev { color:var(--dim); flex:0 0 auto; display:inline-flex; }
  .chev svg { width:20px; height:20px; }
  .empty { text-align:center; color:var(--muted); padding:48px 20px; font-size:14px; }
  .skel { height:66px; border-radius:13px; background:linear-gradient(90deg,#161922 25%,#1e222d 50%,#161922 75%);
    background-size:200% 100%; animation:sh 1.3s infinite; }
  @keyframes sh { to { background-position:-200% 0; } }
  #deskLink { display:block; text-align:center; color:var(--dim); font-size:12.5px; font-weight:600;
    text-decoration:none; padding:4px 0 28px; }
  .status-word { font-size:11px; font-weight:700; margin-top:2px; }
  .sw-working{color:var(--work)} .sw-permission{color:var(--perm)} .sw-stale{color:var(--stale)} .sw-idle{color:var(--muted)}
</style>
</head>
<body>
  <header>
    <div class="top">
      <img class="logo" src="/favicon.svg" alt="">
      <h1>Claude Wall</h1>
      <div class="counts">
        <span class="c cwork" title="Working">
          <svg class="ic" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg><span id="cWork">0</span></span>
        <span class="c cperm" title="Waiting for you">
          <svg class="ic" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span id="cPerm">0</span></span>
        <span class="c cstale" title="Idle 30m+">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span id="cStale">0</span></span>
      </div>
      <button id="refresh" title="Refresh">
        <svg class="ic" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="search" inputmode="search" autocapitalize="off" autocorrect="off"
             autocomplete="off" spellcheck="false" placeholder="Search name, branch, pane…">
      <button id="clear" title="Clear" hidden>
        <svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="chips" id="chips">
      <div class="chip on" data-f="all">All</div>
      <div class="chip" data-f="working">Working</div>
      <div class="chip" data-f="permission">Waiting</div>
      <div class="chip" data-f="stale">30m+</div>
      <div class="chip" data-f="idle">Idle</div>
    </div>
  </header>
  <div id="list">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </div>
  <a id="deskLink" href="/?desktop=1">Full dashboard ↗</a>
<script>
  const listEl = document.getElementById('list');
  const chipsEl = document.getElementById('chips');
  const refreshBtn = document.getElementById('refresh');
  const searchEl = document.getElementById('search');
  const clearEl = document.getElementById('clear');
  let filter = 'all';
  let query = '';
  let panes = [];       // merged pane info
  const RANK = { permission:0, error:0, stale:1, working:2, idle:3 };
  const WORD = { working:'Working', permission:'Waiting for you', stale:'Idle 30m+', idle:'Idle', error:'Error', disconnected:'—' };
  const ICON = {
    chev: '<svg class="ic" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
    term: '<svg class="ic" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg>',
    branch: '<svg class="ic" viewBox="0 0 24 24"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>',
  };

  async function load() {
    try {
      const [sumR, panesR] = await Promise.all([
        fetch('/api/summary').then(r => r.json()),
        fetch('/api/panes').then(r => r.json()).catch(() => []),
      ]);
      document.getElementById('cWork').textContent = sumR.working || 0;
      document.getElementById('cPerm').textContent = sumR.pending || 0;
      document.getElementById('cStale').textContent = sumR.stale || 0;
      const info = {};
      (panesR || []).forEach(p => { info[p.target] = p; });
      panes = (sumR.panes || []).map(p => {
        const x = info[p.target] || {};
        const suffix = p.target.split(':')[1] || '';      // window.pane, e.g. "2.1"
        return {
          target: p.target,
          name: p.dirName || x.dirName || x.session || p.target,
          status: p.status || 'idle',
          agent: x.agent || 'claude',
          branch: x.branch || '',
          session: x.session || (p.target.split(':')[0]),
          pane: suffix.replace('.', ':'),               // window:pane, e.g. "2:1"
        };
      });
      render();
    } catch (e) {
      listEl.innerHTML = '<div class="empty">Can\'t reach server.<br>Is claude-wall running?</div>';
    }
  }

  function render() {
    let rows = panes.slice();
    if (filter !== 'all') {
      rows = rows.filter(p => filter === 'permission'
        ? (p.status === 'permission' || p.status === 'error')
        : p.status === filter);
    }
    if (query) {
      const q = query.toLowerCase();
      rows = rows.filter(p => (p.name + ' ' + p.session + ' ' + p.branch + ' ' + p.pane + ' ' + p.target + ' ' + p.agent)
        .toLowerCase().includes(q));
    }
    rows.sort((a, b) => (RANK[a.status] ?? 5) - (RANK[b.status] ?? 5) || a.name.localeCompare(b.name));
    if (!rows.length) {
      listEl.innerHTML = '<div class="empty">' + (query ? 'No match for “' + esc(query) + '”.' : 'No sessions here.') + '</div>';
      return;
    }
    listEl.innerHTML = rows.map(p => {
      const st = p.status || 'idle';
      const tagCls = p.agent === 'codex' ? 'tag codex' : 'tag';
      const branch = p.branch ? `${ICON.branch}${esc(p.branch)}` : '';
      const sub = p.session ? esc(p.session) + (branch ? ' · ' + branch : '') : (branch || esc(p.target));
      const paneBadge = p.pane ? `<span class="pane">${esc(p.pane)}</span>` : '';
      return `<a class="row" href="/pip.html?m=1&target=${encodeURIComponent(p.target)}">
        <span class="dot ${st}"></span>
        <span class="meta">
          <div class="nameline"><span class="name">${esc(p.name)}</span>${paneBadge}</div>
          <div class="sub">${sub}</div>
          <div class="status-word sw-${st}">${WORD[st] || st}</div>
        </span>
        <span class="${tagCls}">${ICON.term}${esc(p.agent)}</span>
        <span class="chev">${ICON.chev}</span>
      </a>`;
    }).join('');
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  chipsEl.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    filter = c.dataset.f;
    [...chipsEl.children].forEach(ch => ch.classList.toggle('on', ch === c));
    render();
  });
  refreshBtn.onclick = () => { refreshBtn.classList.add('spin'); load().finally(() => setTimeout(() => refreshBtn.classList.remove('spin'), 500)); };

  searchEl.addEventListener('input', () => {
    query = searchEl.value.trim();
    clearEl.hidden = !searchEl.value;
    render();
  });
  clearEl.onclick = () => { searchEl.value = ''; query = ''; clearEl.hidden = true; searchEl.focus(); render(); };

  load();
  setInterval(load, 4000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
